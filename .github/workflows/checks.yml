# Offline checks that need nothing but the repository (and Node for tests/types).
name: checks

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The TV runs node 0.12, where an ES6 construct is a parse error rather
      # than a degraded feature - the server simply never starts.
      - name: ES5 only in the on-TV server
        run: ./scripts/check-es5.py

      - name: tvweb.js and lib modules parse
        run: node --check server/tvweb.js && for f in server/lib/*.js; do node --check "$f"; done

      - name: dashboard reaches for no missing element
        run: ./scripts/check-ui-ids.py

      - name: screen saver QML matches its declared QtQuick version
        run: ./scripts/check-screensavers.py

      - name: documented entity list and deploy list match the code
        run: ./scripts/check-drift.py

      # Preinstalled on ubuntu-latest.
      - name: shell scripts
        run: shellcheck server/deploy.sh server/tvwebctl server/50-tvweb.sh server/assets/launcher-app/install-app.sh server/assets/launcher-app/home-mode.sh tvstats.sh

      - name: TypeScript type check
        run: npm ci && npx tsc

      - name: unit tests
        run: node test/run-all.js

      - name: entity templates resolve against fixture
        run: ./scripts/check-entities.py --stats test/fixtures/stats-b8-webos4.json
