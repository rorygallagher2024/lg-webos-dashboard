<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920,initial-scale=1">
<title>tvweb dashboard</title>
<style>
/* The dashboard as it appears on the TV itself, driven by the remote.
   Left/Right flips between sections, Up/Down moves within one, Enter acts on
   the selected row. Outfit for headings (the spectacle face), Manrope for the
   rows, on true black. Sized for 1080p viewed from the sofa, which is why the
   type is large and the palette is opacity steps rather than colour. */
@font-face{font-family:'Outfit';src:url('/assets/fonts/Outfit.ttf') format('truetype');font-weight:100 900;font-display:swap}
@font-face{font-family:'Manrope';src:url('/assets/fonts/Manrope.ttf') format('truetype');font-weight:200 800;font-display:swap}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;overflow:hidden}
body{font-family:'Manrope',sans-serif;color:#fff;
  /* the remote drives it; there is no pointer */ cursor:none}

#stage{height:100vh;display:flex;flex-direction:column;padding:5vh 0 5vh 8vw}

#clock{font-family:'Outfit';font-weight:200;font-size:4.4vh;letter-spacing:.01em;
  line-height:1;opacity:.55;flex:0 0 auto;margin-bottom:3.4vh}

#tabs{display:flex;align-items:baseline;gap:2.8vw;flex:0 0 auto;margin-bottom:4.4vh}
.tab{font-family:'Outfit';font-weight:200;font-size:4.2vh;line-height:1;letter-spacing:.01em;
  color:rgba(255,255,255,.26);transition:color .22s ease;white-space:nowrap}
.tab.on{color:#fff;font-weight:300}

#list{flex:1 1 auto;overflow:hidden;position:relative}
#rows{position:absolute;left:0;right:0;transition:transform .28s cubic-bezier(.4,0,.2,1)}

/* A row is a label and its value. Only the selected one is full white and
   slightly enlarged; the rest recede, so the eye lands on the choice. */
.row{display:flex;align-items:baseline;justify-content:space-between;height:7.6vh;
  padding-right:8vw;opacity:.34;transition:opacity .22s ease,transform .22s ease;
  transform-origin:left center}
.row.sel{opacity:1;transform:scale(1.03)}
.lbl{font-family:'Manrope';font-weight:400;font-size:3.1vh;letter-spacing:.01em}
.val{font-family:'Outfit';font-weight:200;font-size:3.1vh;color:rgba(255,255,255,.5);
  text-align:right;white-space:nowrap;padding-left:4vw}
.row.sel .val{color:rgba(255,255,255,.75)}
.val.on{color:#1ec15f}
.val.off{color:rgba(255,255,255,.28)}
/* An actionable row: the arrow is dim until the row is the selected one, so a
   glance down the list shows what can be pressed without shouting. */
.val.act{color:rgba(255,255,255,.34)}
.row.sel .val.act{color:#1ec15f}
/* A heading inside the list - groups rows without being selectable itself. */
.row.head{height:5.4vh;opacity:1;transform:none}
.row.head .lbl{font-family:'Manrope';font-weight:600;font-size:1.5vh;letter-spacing:.24em;
  text-transform:uppercase;color:rgba(255,255,255,.34)}

#msg{position:absolute;top:50%;left:0;transform:translateY(-50%);
  font-family:'Outfit';font-weight:200;font-size:4vh;color:rgba(255,255,255,.5)}

/* Centred in the gutter to the right of the values, clear of both the labels
   and the numbers, which otherwise run underneath them on a long section. */
.more{position:absolute;right:2.6vw;font-family:'Manrope';font-size:2.4vh;
  color:rgba(255,255,255,.3);opacity:0;transition:opacity .2s;pointer-events:none}
.more.on{opacity:1}
#moreUp{top:0}
#moreDown{bottom:0}

/* Shown briefly after an action so a press that changes something off-screen
   (opening the service menu, scheduling a refresher) still acknowledges. */
#flash{position:absolute;right:8vw;bottom:5vh;font-family:'Manrope';font-weight:400;
  font-size:2.2vh;color:rgba(255,255,255,.6);opacity:0;transition:opacity .3s}
#flash.on{opacity:1}
</style>
</head>
<body>
<div id="stage">
  <div id="clock">--:--</div>
  <nav id="tabs"></nav>
  <div id="list">
    <div id="msg">Loading&hellip;</div>
    <div class="more" id="moreUp">&#9650;</div>
    <div id="rows"></div>
    <div class="more" id="moreDown">&#9660;</div>
  </div>
  <div id="flash"></div>
</div>
<script>
/* Every section reads an endpoint the server already serves to the browser
   dashboard, so nothing here needs its own API. A section is a tab; its rows
   are built from that payload by its own builder below. */
var TABS = [
  { key: 'system',  label: 'System',       url: '/api/stats',       build: sysRows,  poll: 5000 },
  { key: 'oled',    label: 'OLED Care',    url: '/api/oledcare',    build: oledRows },
  { key: 'saver',   label: 'Screen Saver', url: '/api/screensaver', build: saverRows },
  { key: 'privacy', label: 'Privacy',      url: '/api/privacy',     build: privacyRows },
  { key: 'remote',  label: 'Remote',       url: '/api/shortcut',    build: shortcutRows },
  { key: 'service', label: 'Service Menu', url: '/api/servicemenu', build: svcRows }
];

/*
 * The labels LG prints on the shortcut buttons, which the TV reports only by its
 * own internal name. Anything not listed falls back to that name capitalised, so
 * a button this build has not seen still appears rather than being dropped.
 */
var SC_LABELS = {
  netflix: 'Netflix', amazon: 'Prime Video', disneyplus: 'Disney+',
  rakutentv: 'Rakuten TV', lgchannels: 'LG Channels', movies: 'Movies',
  apps: 'Apps', 'new': 'LG Channels', ivi: 'ivi', globoplay: 'Globoplay',
  okko: 'Okko', kinopoisk: 'Kinopoisk', watchaplay: 'Watcha', unext: 'U-NEXT',
  hotstar: 'Hotstar', fptplay: 'FPT Play', shahid: 'Shahid', wavve: 'Wavve',
  coupangplay: 'Coupang Play', stan: 'Stan', slingtv: 'Sling TV', tver: 'TVer',
  hulu: 'Hulu', nhkplus: 'NHK Plus', tod: 'TOD', sonyliv: 'SonyLIV',
  tv360: 'TV360', vtvgo: 'VTV Go', freeviewplay: 'Freeview Play',
  wink: 'Wink', start: 'Start', shop: 'Shop'
};
function scLabel(b) { return SC_LABELS[b] || (b.charAt(0).toUpperCase() + b.slice(1)); }

var tab = 0, sel = 0, busy = false, ROW_VH = 7.6, HEAD_VH = 5.4;
var data = {}, rows = [], timer = null, flashTimer = null;

function T() { return TABS[tab]; }

function tick() {
  var d = new Date(), h = d.getHours(), m = d.getMinutes();
  document.getElementById('clock').textContent =
    (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
}
setInterval(tick, 10000); tick();

function esc(s) { return String(s).replace(/[&<>"]/g, function(c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

function num(n) {
  if (n === null || n === undefined) return '—';
  return Number(n).toLocaleString();
}

function fmtKB(kb) {
  if (!kb && kb !== 0) return '—';
  if (kb >= 1048576) return (kb / 1048576).toFixed(1) + ' GB';
  return Math.round(kb / 1024) + ' MB';
}

function fmtUptime(sec) {
  var d = Math.floor(sec / 86400), h = Math.floor((sec % 86400) / 3600),
      m = Math.floor((sec % 3600) / 60);
  return d > 0 ? d + 'd ' + h + 'h' : h + 'h ' + m + 'm';
}

/* The server returns some values with their unit already attached and some
   without, so strip a trailing unit before adding one rather than printing
   "120 Hz Hz". Percent sits tight against its number; the rest take a space. */
function withUnit(v, unit) {
  if (v === null || v === undefined || v === '') return '—';
  var re = new RegExp('\\s*' + unit.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '$', 'i');
  return String(v).replace(re, '') + (unit === '%' ? '' : ' ') + unit;
}

function head(label) { return { label: label, head: true }; }

// ---- row builders, one per section ----

function sysRows(d) {
  if (!d || !d.ok) return [];
  var r = [];
  r.push(head('Load'));
  if (d.temp !== null && d.temp !== undefined) r.push({ label: 'Temperature', value: withUnit(d.temp, '°C') });
  if (d.load !== null && d.load !== undefined) r.push({ label: 'CPU load', value: withUnit(d.load, '%') });
  if (d.mhz) r.push({ label: 'CPU frequency', value: withUnit(d.mhz, 'MHz') });
  if (d.gpuMhz) r.push({ label: 'GPU clock', value: withUnit(d.gpuMhz, 'MHz') });
  if (d.cores && d.cores.length)
    r.push({ label: 'Per-core load', value: d.cores.map(function (c) { return c + '%'; }).join('  ') });

  r.push(head('Memory and storage'));
  if (d.mem) r.push({ label: 'Memory free', value: fmtKB(d.mem.avail) + ' of ' + fmtKB(d.mem.total) });
  if (d.swap && d.swap.total) r.push({ label: 'Swap free', value: fmtKB(d.swap.free) + ' of ' + fmtKB(d.swap.total) });
  if (d.emmc && d.emmc.health) r.push({ label: 'eMMC health', value: d.emmc.health });

  r.push(head('This TV'));
  if (d.device && d.device.model) r.push({ label: 'Model', value: d.device.model });
  if (d.system && d.system.firmware) r.push({ label: 'Firmware', value: d.system.firmware });
  if (d.system && d.system.webos) r.push({ label: 'webOS', value: String(d.system.webos) });
  if (d.hardware && d.hardware.soc_arch) r.push({ label: 'SoC', value: d.hardware.soc_arch });
  if (d.hardware && d.hardware.ram) r.push({ label: 'RAM', value: d.hardware.ram });
  if (d.hardware && d.hardware.refresh_rate) r.push({ label: 'Panel refresh', value: withUnit(d.hardware.refresh_rate, 'Hz') });
  if (d.uptime) r.push({ label: 'Uptime', value: fmtUptime(d.uptime) });
  if (d.remote && d.remote.battery !== null && d.remote.battery !== undefined)
    r.push({ label: 'Remote battery', value: withUnit(d.remote.battery, '%') });
  if (d.ssid) r.push({ label: 'Wi-Fi', value: d.ssid });
  return r;
}

function oledRows(d) {
  if (!d || !d.ok) return [];
  if (!d.isOled) return [{ label: 'This is not an OLED panel', value: '' }];
  var canSet = d.writable && d.serviceControls;
  var r = [];

  r.push(head('Panel life'));
  if (d.panelHours !== null && d.panelHours !== undefined)
    r.push({ label: 'Total power-on hours', value: num(d.panelHours) });
  if (d.hoursUntilComp !== null && d.hoursUntilComp !== undefined)
    r.push({ label: 'Panel maintenance in', value: withUnit(Math.round(d.hoursUntilComp), 'h') });
  if (d.hoursUntilRefresher !== null && d.hoursUntilRefresher !== undefined)
    r.push({ label: 'Pixel refresher in', value: withUnit(Math.round(d.hoursUntilRefresher), 'h') });
  if (d.compCycles !== null && d.compCycles !== undefined)
    r.push({ label: 'Short cycles completed', value: num(d.compCycles) });
  if (d.refresherCycles !== null && d.refresherCycles !== undefined)
    r.push({ label: 'Pixel refresher cycles', value: num(d.refresherCycles) });
  if (d.gsrStressCount !== null && d.gsrStressCount !== undefined)
    r.push({ label: 'GSR stress events', value: num(d.gsrStressCount) });

  r.push(head('Protections'));
  if (d.gsr !== null && d.gsr !== undefined)
    r.push({ label: 'Global sticky reduction', value: d.gsr ? 'On' : 'Off', cls: d.gsr ? 'on' : 'off',
             act: canSet ? 'oled' : null, key: 'gsr', on: d.gsr, guard: true });
  if (d.tpc !== null && d.tpc !== undefined)
    r.push({ label: 'Temporal peak control', value: d.tpc ? 'On' : 'Off', cls: d.tpc ? 'on' : 'off',
             act: canSet ? 'oled' : null, key: 'tpc', on: d.tpc, guard: true });
  if (d.screenShift)
    r.push({ label: 'Screen shift', value: d.screenShift, cls: /on/i.test(d.screenShift) ? 'on' : 'off',
             act: d.writable ? 'shift' : null, on: /on/i.test(d.screenShift) });
  if (d.logoDimming)
    r.push({ label: 'Logo dimming', value: d.logoDimming, cls: /off/i.test(d.logoDimming) ? 'off' : 'on',
             act: d.writable ? 'logo' : null, cur: String(d.logoDimming).toLowerCase() });

  if (d.writable) {
    r.push(head('Run now'));
    r.push({ label: 'Schedule a pixel refresher', value: '→', cls: 'act', act: 'refresh' });
    r.push({ label: 'Cancel a scheduled refresher', value: '→', cls: 'act', act: 'refreshCancel' });
  }
  return r;
}

function saverRows(d) {
  if (!d || !d.ok || !d.modes) return [];
  var r = [head('Screen saver')];
  d.modes.filter(function (m) { return m.available; }).forEach(function (m) {
    r.push({ label: m.label, value: m.active ? 'In use' : '', cls: m.active ? 'on' : '',
             act: d.writable ? 'saver' : null, key: m.id });
  });
  return r;
}

function privacyRows(d) {
  if (!d || !d.ok) return [];
  var r = [];

  if (d.adblock) {
    r.push(head('Ad and tracker blocking'));
    r.push({ label: 'Blocking', value: d.adblock.enabled ? 'On' : 'Off',
             cls: d.adblock.enabled ? 'on' : 'off', act: 'adblock', on: d.adblock.enabled });
    if (d.adblock.enabled) {
      if (d.adblock.mode) r.push({ label: 'Mode', value: d.adblock.mode });
      if (d.adblock.count !== null && d.adblock.count !== undefined)
        r.push({ label: 'Domains blocked', value: num(d.adblock.count) });
    }
  }

  if (d.acr) {
    r.push(head('Screen content recognition'));
    r.push({ label: d.acr.label || 'Screen content recognition',
             value: d.acr.active ? 'Active' : 'Off', cls: d.acr.active ? 'off' : 'on' });
    if (d.acr.captureState)
      r.push({ label: 'Capture', value: d.acr.capturing ? 'Capturing' : 'Stopped',
               cls: d.acr.capturing ? 'off' : 'on' });
  }

  if (d.advertisingId && d.advertisingId.available) {
    r.push(head('Advertising identifier'));
    r.push({ label: d.advertisingId.limitTrackingLabel || 'Limit ad tracking',
             value: d.advertisingId.limitTracking ? 'On' : 'Off',
             cls: d.advertisingId.limitTracking ? 'on' : 'off' });
    r.push({ label: 'Reset the advertising ID', value: '→', cls: 'act', act: 'resetAdId' });
  }

  /* The consent flags are many and each needs its own agreement text to mean
     anything, which does not belong on a screen read from the sofa. The count
     says whether anything is on; the browser dashboard is where they change. */
  if (d.consent && d.consent.known) {
    var all = d.consent.known.concat(d.consent.other || []);
    var on = all.filter(function (c) { return c.enabled; }).length;
    r.push(head('Data consents'));
    r.push({ label: 'Consents switched on', value: on + ' of ' + all.length,
             cls: on === 0 ? 'on' : '' });
  }

  if (d.daemons && d.daemons.length) {
    var run = d.daemons.filter(function (x) { return x.running; }).length;
    r.push({ label: 'LG data services running', value: run + ' of ' + d.daemons.length,
             cls: run === 0 ? 'on' : '' });
  }
  return r;
}

/*
 * Pressing a row hands that button to this app, or gives it back. Changing one
 * reloads the compositor, which closes this app - so the row says so first and
 * the press is a deliberate second step rather than a surprise.
 */
function shortcutRows(d) {
  if (!d || !d.ok) return [];
  if (!d.supported) return [{ label: 'Not available on this TV', value: '' }];
  var buttons = d.buttons || [];
  if (!buttons.length) return [{ label: 'This remote has no shortcut buttons', value: '' }];
  var bound = {};
  (d.bindings || []).forEach(function (b) { bound[b.button] = b.appId; });

  var r = [head('Opens this dashboard')];
  buttons.forEach(function (b) {
    var on = bound[b.button] === d.defaultApp;
    r.push({ label: scLabel(b.button), value: on ? 'Yes' : '',
             cls: on ? 'on' : '',
             act: d.writable ? 'shortcut' : null, key: b.button, on: on });
  });
  r.push(head('The screen reloads when this changes'));
  return r;
}

function svcRows(d) {
  if (!d || !d.ok) return [];
  var r = [head('Service menu')];
  if (d.lockable)
    r.push({ label: 'Lock', value: d.locked ? 'Locked' : 'Unlocked',
             cls: d.locked ? 'on' : 'off', act: d.writable ? 'lock' : null, on: d.locked });
  if (d.app && d.writable) {
    r.push({ label: 'Open EZ Adjust', value: '→', cls: 'act', act: 'menu', key: 'ezAdjust' });
    r.push({ label: 'Open In Start', value: '→', cls: 'act', act: 'menu', key: 'inStart' });
  }
  if (r.length === 1) r.push({ label: 'Not available on this TV', value: '' });
  return r;
}

// ---- rendering ----

function rowHeight(r) { return (r && r.head ? HEAD_VH : ROW_VH) * window.innerHeight / 100; }

function render() {
  var box = document.getElementById('rows'), msg = document.getElementById('msg');
  if (!rows.length) {
    box.innerHTML = '';
    msg.style.display = 'block';
    msg.textContent = data[T().key] ? 'Nothing to show here' : 'Loading…';
    return;
  }
  msg.style.display = 'none';
  box.innerHTML = rows.map(function (r, i) {
    if (r.head) return '<div class="row head"><span class="lbl">' + esc(r.label) + '</span></div>';
    return '<div class="row' + (i === sel ? ' sel' : '') + '">' +
             '<span class="lbl">' + esc(r.label) + '</span>' +
             '<span class="val' + (r.cls ? ' ' + r.cls : '') + '">' + esc(r.value) + '</span>' +
           '</div>';
  }).join('');
  position();
}

/* Headings are not landing places, so the selection skips over them and the
   offset is summed from real row heights rather than multiplied.
   The list is anchored to the top and only starts scrolling once the selection
   passes the middle, so a short section fills the screen from the top instead
   of floating in the centre with half the screen empty. */
function position() {
  var list = document.getElementById('list');
  var off = 0, total = 0, i;
  for (i = 0; i < rows.length; i++) {
    if (i < sel) off += rowHeight(rows[i]);
    total += rowHeight(rows[i]);
  }
  var centre = list.clientHeight / 2 - rowHeight(rows[sel]) / 2;
  var y = centre - off;
  var floor = Math.min(0, list.clientHeight - total);   // never scroll past the last row
  if (y > 0) y = 0;
  if (y < floor) y = floor;
  document.getElementById('rows').style.transform = 'translateY(' + y + 'px)';
  document.getElementById('moreUp').className = 'more' + (y < 0 ? ' on' : '');
  document.getElementById('moreDown').className = 'more' + (y > floor ? ' on' : '');
}

function firstSel() {
  for (var i = 0; i < rows.length; i++) if (!rows[i].head) return i;
  return 0;
}
function lastSel() {
  for (var i = rows.length - 1; i >= 0; i--) if (!rows[i].head) return i;
  return 0;
}

function move(d) {
  if (!rows.length) return;
  var i = sel;
  do { i += d; } while (i >= 0 && i < rows.length && rows[i].head);
  if (i < 0 || i >= rows.length) return;
  sel = i;
  render();
}

function renderTabs() {
  document.getElementById('tabs').innerHTML = TABS.map(function (t, i) {
    return '<div class="tab' + (i === tab ? ' on' : '') + '">' + esc(t.label) + '</div>';
  }).join('');
}

function flash(text) {
  var el = document.getElementById('flash');
  el.textContent = text;
  el.className = 'on';
  if (flashTimer) clearTimeout(flashTimer);
  flashTimer = setTimeout(function () { el.className = ''; }, 2400);
}

// ---- data ----

function fetchTab(keepSel) {
  var t = T(), key = t.key;
  fetch(t.url, { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (T().key !== key) return;        // the user moved on while this was in flight
      data[key] = d;
      rows = t.build(d) || [];
      if (!keepSel || sel >= rows.length || (rows[sel] && rows[sel].head)) sel = firstSel();
      render();
    })
    .catch(function () {
      if (T().key !== key || rows.length) return;
      document.getElementById('rows').innerHTML = '';
      var msg = document.getElementById('msg');
      msg.style.display = 'block';
      msg.textContent = 'Could not reach the TV server';
    });
}

function openTab(i) {
  if (timer) { clearInterval(timer); timer = null; }
  tab = i; sel = 0; rows = [];
  renderTabs();
  var cached = data[T().key];
  if (cached) { rows = T().build(cached) || []; sel = firstSel(); }
  render();
  fetchTab(!!cached);
  if (T().poll) timer = setInterval(function () { fetchTab(true); }, T().poll);
}

function switchTab(d) {
  var n = tab + d;
  if (n < 0 || n >= TABS.length) return;
  openTab(n);
}

// ---- actions ----

function send(body, note) {
  busy = true;
  fetch('/api/control', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function (r) { return r.json().catch(function () { return {}; }); })
    .then(function (res) {
      busy = false;
      if (res && res.ok === false) flash(res.error || 'That did not work');
      else if (note) flash(note);
      fetchTab(true);
    })
    .catch(function () { busy = false; flash('That did not work'); });
}

function activate() {
  if (busy || !rows.length) return;
  var r = rows[sel];
  if (!r || !r.act) return;
  switch (r.act) {
    case 'oled':
      return send({ action: 'oledProtection', value: { key: r.key, enabled: !r.on } },
                  r.on ? 'Switched off' : 'Switched on');
    case 'shift':
      return send({ action: 'screenShift', value: r.on ? 'off' : 'on' });
    case 'logo':
      // off -> light -> strong -> off
      var next = r.cur === 'off' ? 'light' : (r.cur === 'light' ? 'strong' : 'off');
      return send({ action: 'logoDimming', value: next });
    case 'refresh':
      return send({ action: 'refresherSchedule' }, 'Refresher scheduled');
    case 'refreshCancel':
      return send({ action: 'refresherCancel' }, 'Refresher cancelled');
    case 'saver':
      return send({ action: 'screensaverMode', value: r.key });
    case 'adblock':
      return send({ action: 'toggleAdBlock' });
    case 'resetAdId':
      return send({ action: 'resetAdId' }, 'Advertising ID reset');
    case 'lock':
      return send({ action: 'serviceMenuLock', value: { locked: !r.on } });
    case 'menu':
      return send({ action: 'serviceMenuOpen', value: { menu: r.key } }, 'Opening…');
    case 'shortcut':
      return send({ action: 'shortcutKey',
                    value: r.on ? { button: r.key, clear: true } : { button: r.key } },
                  r.on ? 'Giving the button back…' : 'Assigning…');
  }
}

// ---- keys ----

document.addEventListener('keydown', function (e) {
  var k = e.key, c = e.keyCode;
  if      (c === 37 || k === 'ArrowLeft')  { switchTab(-1); e.preventDefault(); }
  else if (c === 39 || k === 'ArrowRight') { switchTab(1);  e.preventDefault(); }
  else if (c === 38 || k === 'ArrowUp')    { move(-1);      e.preventDefault(); }
  else if (c === 40 || k === 'ArrowDown')  { move(1);       e.preventDefault(); }
  else if (c === 13 || k === 'Enter')      { activate();    e.preventDefault(); }
  // Back (461 on webOS) is left to the system, which closes the app.
});
window.addEventListener('resize', function () { if (rows.length) position(); });

renderTabs();
openTab(0);
</script>
