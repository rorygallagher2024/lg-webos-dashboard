<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Glasshouse</title>
<style>
/* The dashboard as it appears on the TV itself, driven by the remote.
   Left/Right flips between sections, Up/Down moves within one, Enter acts on
   the selected row. Outfit for headings (the spectacle face), Manrope for the
   rows, on true black. Sized for 1080p viewed from the sofa, which is why the
   type is large and the palette is opacity steps rather than colour. */
@font-face{font-family:'Outfit';src:url('/assets/fonts/Outfit-Light.ttf') format('truetype');font-weight:300;font-display:swap}
@font-face{font-family:'Outfit';src:url('/assets/fonts/Outfit-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'Manrope';src:url('/assets/fonts/Manrope-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'Manrope';src:url('/assets/fonts/Manrope-SemiBold.ttf') format('truetype');font-weight:600;font-display:swap}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;overflow:hidden}
body{font-family:'Manrope',sans-serif;color:#fff;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;
  /* the remote drives it; there is no pointer */ cursor:none}

#stage{height:100vh;display:flex;flex-direction:column;padding:5vh 0 5vh 8vw}

#clock{font-family:'Manrope',sans-serif;font-weight:400;font-size:4.4vh;letter-spacing:.01em;
  line-height:1;opacity:.65;flex:0 0 auto;margin-bottom:3.4vh}

#tabs{display:flex;display:-webkit-flex;align-items:baseline;-webkit-align-items:baseline;flex:0 0 auto;margin:0 4vw 3.2vh 0;
  /* the bar clips so it can scroll, and at line-height 1 that takes the tails
     of g and y with it; the padding makes room and the margin gives it back */
  padding-bottom:1.2vh;white-space:nowrap;overflow:hidden}
#tabs.clip-r{-webkit-mask-image:linear-gradient(to right,#000 88%,transparent);mask-image:linear-gradient(to right,#000 88%,transparent)}
#tabs.clip-l{-webkit-mask-image:linear-gradient(to left,#000 88%,transparent);mask-image:linear-gradient(to left,#000 88%,transparent)}
#tabs.clip-l.clip-r{-webkit-mask-image:linear-gradient(to right,transparent,#000 12%,#000 88%,transparent);
  mask-image:linear-gradient(to right,transparent,#000 12%,#000 88%,transparent)}
.tab{display:inline-block;font-family:'Manrope',sans-serif;font-weight:400;font-size:4.2vh;line-height:1;letter-spacing:.01em;
  color:rgba(255,255,255,.50);transition:color .22s ease;white-space:nowrap;
  flex:0 0 auto;-webkit-flex:0 0 auto;padding-right:2.8vw;cursor:pointer}
.tab:last-child{padding-right:0}
/* A hidden bold copy sets each tab's width, so selecting one (which bolds it)
   does not push the tabs after it along. */
.tab::after{content:attr(data-label);display:block;font-weight:600;height:0;overflow:hidden;visibility:hidden}
.tab.on{color:#fff;font-weight:600}

/* Two columns: the rows on the left, an explainer for whichever row is selected
   on the right. A row's label and value never needed the full width, and the
   space buys somewhere to say what a setting means without a second screen. */
#main{flex:1 1 auto;display:flex;overflow:hidden;padding-right:4vw;min-height:0}
#list{flex:1 1 62%;overflow:hidden;position:relative}
#rows{position:absolute;left:0;right:0;transition:transform .28s cubic-bezier(.4,0,.2,1)}

#hint{flex:0 0 31%;margin-left:2.6vw;align-self:center;border-left:1px solid rgba(255,255,255,.14);
  padding-left:2.4vw;opacity:0;transition:opacity .22s ease}
#hint.on{opacity:1}
.h-title{font-family:'Manrope',sans-serif;font-weight:600;font-size:3.4vh;line-height:1.15;
  letter-spacing:.005em;margin-bottom:1.6vh}
.h-body{font-family:'Manrope',sans-serif;font-weight:400;font-size:2.1vh;line-height:1.65;
  color:rgba(255,255,255,.68)}
/* What OK does here, or that it does nothing. Green only when there is
   something to press, so the colour itself carries the distinction. */
.h-act{font-family:'Manrope',sans-serif;font-weight:600;font-size:1.7vh;letter-spacing:.14em;
  text-transform:uppercase;margin-top:2.4vh;color:#1ec15f}
.h-act.ro{color:rgba(255,255,255,.50)}

/* For the few rows that can only be changed in a browser: a code to scan and
   the address under it, so the dashboard can be opened without typing an
   address on a remote. White on black would invert the code, so it sits on a
   white tile with its own quiet zone. */
.h-qr{margin-top:2.4vh;display:none}
.h-qr.on{display:block}
.h-qr svg{width:15vh;height:15vh;display:block;background:#fff;padding:1vh;border-radius:.6vh}
.h-url{font-family:'Manrope',sans-serif;font-weight:400;font-size:1.6vh;letter-spacing:.01em;
  color:rgba(255,255,255,.55);margin-top:1.2vh;word-break:break-all}

/* A row is a label and its value. Only the selected one is full white and
   slightly enlarged; the rest recede, so the eye lands on the choice. */
/* The right padding is the scroll arrows' lane, so a long value never runs
   underneath one. */
.row{display:flex;align-items:baseline;justify-content:space-between;height:7.6vh;
  padding-right:3.4vw;
  opacity:.55;transition:opacity .22s ease,transform .22s ease;
  transform-origin:left center}
.row:not(.head){cursor:pointer}
.row.sel{opacity:1;transform:scale(1.03)}
.lbl{font-family:'Manrope',sans-serif;font-weight:500;font-size:3.1vh;letter-spacing:.01em}
.val{font-family:'Manrope',sans-serif;font-weight:400;font-size:3.1vh;color:rgba(255,255,255,.75);
  text-align:right;white-space:nowrap;padding-left:2vw}
.row.sel .val{font-weight:600;color:rgba(255,255,255,.90)}
.val.on{color:#1ec15f}
.val.off{color:rgba(255,255,255,.45)}
.val.bad{color:#e65050}
.val.warn{color:#ff9800}
.val.act{color:rgba(255,255,255,.50)}
.row.sel .val.act{color:#1ec15f}
.row.sel .val.bad{color:#ff6b6b}
.row.sel .val.warn{color:#ffb74d}
/* A read-out rather than a setting: a status label with a lit dot, set small in
   capitals, so it cannot be mistaken for the On/Off values of the toggles. The
   glow is a blurred shadow: color-mix is too new for the webOS 4 browser. */
.val.st{display:inline-flex;align-items:center;font-size:2.1vh;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase}
.val.st::before{content:'';width:1vh;height:1vh;border-radius:50%;margin-right:1.3vh;
  background:currentColor;box-shadow:0 0 1.2vh currentColor}
.val.st.good,.row.sel .val.st.good{color:#1ec15f}
.val.st.hold,.row.sel .val.st.hold{color:#ff9800}
.val.st.note,.row.sel .val.st.note{color:rgba(255,255,255,.55)}
.val.st.bad,.row.sel .val.st.bad{color:#e65050}

/* The mark that separates a row you can press from one you can only read. It
   sits in a gutter every row reserves, so nothing shifts as the eye moves down
   and the pressable ones line up as a column of their own. */
.lbl::before{content:'';display:inline-block;width:.9vh;height:.9vh;
  border-radius:50%;margin-right:1.6vh;vertical-align:middle;
  background:transparent;transition:background .22s ease}
.row.doable .lbl::before{background:rgba(255,255,255,.45)}
.row.doable.sel .lbl::before{background:#1ec15f}

/* A heading inside the list - groups rows without being selectable itself. */
.row.head{height:5.4vh;opacity:1;transform:none}
.row.head .lbl{font-family:'Manrope';font-weight:600;font-size:1.5vh;letter-spacing:.24em;
  text-transform:uppercase;color:rgba(255,255,255,.55)}
.row.head .lbl::before{display:none}

#msg{position:absolute;top:50%;left:0;transform:translateY(-50%);
  font-family:'Manrope',sans-serif;font-weight:400;font-size:4vh;color:rgba(255,255,255,.8)}
#msg .msg-detail{font-family:'Manrope',sans-serif;font-weight:400;font-size:2vh;line-height:1.8;
  color:rgba(255,255,255,.6);margin-top:2.2vh}
#msg .msg-url{color:rgba(255,255,255,.75)}

/* In the lane the rows leave clear on the right, so neither the labels nor the
   values ever run underneath one. */
.more{position:absolute;right:0;font-family:'Manrope',sans-serif;font-size:2.4vh;
  color:rgba(255,255,255,.50);opacity:0;transition:opacity .2s;pointer-events:none}
.more.on{opacity:1}
#moreUp{top:0}
#moreDown{bottom:0}

/* Shown briefly after an action so a press that changes something off-screen
   (opening the service menu, scheduling a refresher) still acknowledges. */
#flash{position:absolute;right:8vw;bottom:5vh;font-family:'Manrope',sans-serif;font-weight:400;
  font-size:2.2vh;color:rgba(255,255,255,.85);opacity:0;transition:opacity .3s}
#flash.on{opacity:1}

/* ---- light theme ---- */
body.light, html.light{background:#f5f5f5;color:#111}
body.light #clock{color:#000;opacity:.7}
body.light .tab{color:rgba(0,0,0,.52)}
body.light .tab.on{color:#000;font-weight:600}
body.light #hint{border-left-color:rgba(0,0,0,.15)}
body.light .h-title{color:#000}
body.light .h-body{color:rgba(0,0,0,.78)}
body.light .h-act{color:#15803d}
body.light .h-act.ro{color:rgba(0,0,0,.50)}
body.light .h-qr svg{border:1px solid rgba(0,0,0,.15)}
body.light .h-url{color:rgba(0,0,0,.65)}
body.light .row{opacity:.62}
body.light .row.sel{opacity:1}
body.light .row.sel .lbl{color:#000;font-weight:600}
body.light .val{color:rgba(0,0,0,.70)}
body.light .row.sel .val{color:rgba(0,0,0,.92);font-weight:600}
body.light .val.on{color:#15803d}
body.light .val.off{color:rgba(0,0,0,.48)}
body.light .val.bad{color:#dc2626}
body.light .val.warn{color:#b45309}
body.light .val.st.good{color:#15803d}
body.light .val.st.hold{color:#b45309}
body.light .val.st.note{color:rgba(0,0,0,.55)}
body.light .val.st.bad{color:#b91c1c}
body.light .val.act{color:rgba(0,0,0,.52)}
body.light .row.sel .val.act{color:#15803d}
body.light .row.sel .val.bad{color:#dc2626}
body.light .row.sel .val.warn{color:#b45309}
body.light .row.doable .lbl::before{background:rgba(0,0,0,.38)}
body.light .row.doable.sel .lbl::before{background:#15803d}
body.light .row.head .lbl{color:rgba(0,0,0,.62)}
body.light #msg{color:rgba(0,0,0,.8)}
body.light #msg .msg-detail{color:rgba(0,0,0,.65)}
body.light #msg .msg-url{color:rgba(0,0,0,.85)}
body.light .more{color:rgba(0,0,0,.50)}
body.light #flash{color:rgba(0,0,0,.88)}
</style>
</head>
<body>
<div id="stage">
  <div id="clock">--:--</div>
  <nav id="tabs"></nav>
  <div id="main">
    <div id="list">
      <div id="msg"></div>
      <div class="more" id="moreUp">&#9650;</div>
      <div id="rows"></div>
      <div class="more" id="moreDown">&#9660;</div>
    </div>
    <aside id="hint">
      <div class="h-title" id="hintTitle"></div>
      <div class="h-body" id="hintBody"></div>
      <div class="h-act" id="hintAct"></div>
      <div class="h-qr" id="hintQr"><svg id="hintQrSvg" viewBox="0 0 33 33" shape-rendering="crispEdges"></svg><div class="h-url" id="hintUrl"></div></div>
    </aside>
  </div>
  <div id="flash"></div>
</div>
<script src="/assets/qr.js"></script>
<script src="/assets/i18n.js"></script>
<script>
/* Every section reads an endpoint the server already serves to the browser
   dashboard, so nothing here needs its own API. A section is a tab; its rows
   are built from that payload by its own builder below. */
var TABS = [
  // Metrics keeps the key it had as System, which the installed app opens on.
  { key: 'system',  label: t('tab.metrics', 'Metrics'),      url: '/api/stats',       build: sysRows,  poll: 5000 },
  { key: 'apps',    label: t('tab.apps', 'Apps'),         url: '/api/apps',        build: appsRows },
  { key: 'oled',    label: t('tab.oledCare', 'OLED Care'),    url: '/api/oledcare',    build: oledRows },
  { key: 'saver',   label: t('tv.tab.screenSaver', 'Screen Saver'), url: '/api/screensaver', build: saverRows },
  { key: 'privacy', label: t('tab.privacy', 'Privacy'),      url: '/api/privacy',     build: privacyRows },
  { key: 'service', label: t('tv.tab.serviceMenu', 'Service Menu'), url: '/api/servicemenu', build: svcRows },
  { key: 'options', label: t('tv.tab.system', 'System'),       url: '/api/stats',       build: optionRows, poll: 5000 },
  { key: 'update',  label: t('tv.tab.updates', 'Updates'),      url: '/api/update',      build: updateRows },
  { key: 'settings', label: t('tv.tab.settings', 'Settings'),    url: '/api/setup',       build: settingsRows }
];

var tab = 0, sel = 0, busy = false, ROW_VH = 7.6, HEAD_VH = 5.4;
var initialSel = null;
/* Where a phone can reach this server. Only the server knows it - the app is
   served from localhost - so it is asked for once and kept. */
var lanOrigin = null, lanKey = null;
function refreshCaps() {
  fetch('/api/caps', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      // A new install walks through setup first - but only in the TV app: a
      // phone's browser cannot use those screens.
      if (d && d.setupNeeded && window.PalmSystem) return location.replace('/assets/setup.html');
      lanOrigin = (d && d.origin) || null;
      lanKey = (d && d.key) || null;
      renderHint();
    })
    .catch(function () {});
}
refreshCaps();
var data = {}, rows = [], timer = null, flashTimer = null;
document.getElementById('msg').textContent = t('tv.loading', 'Loading\u2026');
var currentTheme = 'dark';
try {
  var urlTheme = (location.search.match(/[?&]theme=([^&]+)/) || [])[1];
  currentTheme = urlTheme || localStorage.getItem('theme') || 'dark';
} catch (e) { currentTheme = 'dark'; }

function applyTheme(theme) {
  currentTheme = theme === 'light' ? 'light' : 'dark';
  if (document.documentElement) {
    document.documentElement.className = currentTheme === 'light' ? 'light' : '';
  }
  if (document.body) {
    document.body.className = currentTheme === 'light' ? 'light' : '';
  }
}
applyTheme(currentTheme);

function T() { return TABS[tab]; }

function tick() {
  var d = new Date(), h = d.getHours(), m = d.getMinutes();
  document.getElementById('clock').textContent =
    (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
}
setInterval(tick, 10000); tick();

function esc(s) { return String(s).replace(/[&<>"]/g, function(c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

function num(n) {
  if (n === null || n === undefined) return '—';
  return Number(n).toLocaleString();
}

function fmtKB(kb) {
  if (!kb && kb !== 0) return '—';
  if (kb >= 1048576) return (kb / 1048576).toFixed(1) + ' GB';
  return Math.round(kb / 1024) + ' MB';
}

function fmtUptime(sec) {
  var d = Math.floor(sec / 86400), h = Math.floor((sec % 86400) / 3600),
      m = Math.floor((sec % 3600) / 60);
  return d > 0 ? d + 'd ' + h + 'h' : h + 'h ' + m + 'm';
}

/* The server returns some values with their unit already attached and some
   without, so strip a trailing unit before adding one rather than printing
   "120 Hz Hz". Percent sits tight against its number; the rest take a space. */
function withUnit(v, unit) {
  if (v === null || v === undefined || v === '') return '—';
  var re = new RegExp('\\s*' + unit.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '$', 'i');
  return String(v).replace(re, '') + (unit === '%' ? '' : ' ') + unit;
}

function head(label) { return { label: label, head: true }; }

// ---- row builders, one per section ----

function sysRows(d) {
  if (!d || !d.ok) return [];
  var r = [];
  r.push(head(t('tv.system.head.load', 'Load')));
  if (d.temp !== null && d.temp !== undefined) r.push({ label: t('metrics.temperature', 'Temperature'), value: withUnit(d.temp, '°C'),
    hint: t('tv.system.temperature.hint', 'The main processor (SoC) sensor, not the panel. It climbs with video decoding and CPU workload.') });
  if (d.load !== null && d.load !== undefined) r.push({ label: t('tv.system.cpuLoad', 'CPU load'), value: withUnit(d.load, '%'),
    hint: t('tv.system.cpuLoad.hint', 'Across all cores. Brief peaks while an app opens are normal; a sustained high figure with nothing playing is not.') });
  if (d.mhz) r.push({ label: t('tv.system.cpuFrequency', 'CPU frequency'), value: withUnit(d.mhz, 'MHz'),
    hint: t('tv.system.cpuFrequency.hint', 'The current clock. It drops when the TV is idle and rises under load.') });
  if (d.gpuMhz) r.push({ label: t('tv.system.gpuClock', 'GPU clock'), value: withUnit(d.gpuMhz, 'MHz'),
    hint: t('tv.system.gpuClock.hint', 'Drives the interface and video scaling.') });
  if (d.cores && d.cores.length)
    r.push({ label: t('tv.system.perCoreLoad', 'Per-core load'), value: d.cores.map(function (c) { return c + '%'; }).join('  '),
      hint: t('tv.system.perCoreLoad.hint', 'One figure per core. An even spread is healthy; one core pinned while the rest idle points at a stuck process.') });

  r.push(head(t('tv.system.head.memoryAndStorage', 'Memory and storage')));
  if (d.mem) r.push({ label: t('tv.system.memoryFree', 'Memory free'), value: t('tv.system.freeOf', '{free} of {total}', { free: fmtKB(d.mem.avail), total: fmtKB(d.mem.total) }),
    hint: t('tv.system.memoryFree.hint', 'Free memory is expected to be low: webOS keeps apps loaded so they reopen quickly, and releases them under pressure.') });
  if (d.swap && d.swap.total) r.push({ label: t('tv.system.swapFree', 'Swap free'), value: t('tv.system.freeOf', '{free} of {total}', { free: fmtKB(d.swap.free), total: fmtKB(d.swap.total) }),
    hint: t('tv.system.swapFree.hint', 'Compressed memory held in RAM rather than on disk, so heavy use costs speed but does not wear the storage.') });
  if (d.emmc && d.emmc.health) r.push({ label: t('tv.system.emmcHealth', 'eMMC health'), value: d.emmc.health,
    hint: t('tv.system.emmcHealth.hint', 'Life left in the built-in storage, as the chip itself reports it. It falls very slowly and cannot be reset.') });

  r.push(head(t('tv.system.head.thisTv', 'This TV')));
  if (d.device && d.device.model) r.push({ label: t('tv.system.model', 'Model'), value: d.device.model });
  if (d.system && d.system.firmware) r.push({ label: t('metrics.firmware', 'Firmware'), value: d.system.firmware });
  if (d.system && d.system.webos) r.push({ label: 'webOS', value: String(d.system.webos) });
  if (d.hardware && d.hardware.soc_arch) r.push({ label: 'SoC', value: d.hardware.soc_arch });
  if (d.hardware && d.hardware.ram) r.push({ label: 'RAM', value: d.hardware.ram });
  if (d.hardware && d.hardware.refresh_rate) r.push({ label: t('tv.system.panelRefresh', 'Panel refresh'), value: withUnit(d.hardware.refresh_rate, 'Hz') });
  if (d.uptime) r.push({ label: t('tv.system.uptime', 'Uptime'), value: fmtUptime(d.uptime) });
  if (d.remote && d.remote.battery !== null && d.remote.battery !== undefined)
    r.push({ label: t('tv.system.remoteBattery', 'Remote battery'), value: withUnit(d.remote.battery, '%') });
  if (d.ssid) r.push({ label: t('tv.system.wiFi', 'Wi-Fi'), value: d.ssid });

  return r;
}

/*
 * The TV's own settings, grouped as the browser dashboard's Advanced tab groups
 * them. Each shows only where the TV reports a value for it.
 */
function optionRows(d) {
  if (!d || !d.ok) return [];
  var r = [], lights = d.lights || {};
  function toggle(label, on, act, hint, onWord, offWord) {
    return { label: label, value: on ? (onWord || t('common.on', 'On')) : (offWord || t('common.off', 'Off')), cls: 'act', act: act, on: !!on,
             press: on ? t('tv.press.turnOff', 'Press OK to turn off') : t('tv.press.turnOn', 'Press OK to turn on'), hint: hint };
  }
  if (d.quickBoot !== undefined || d.wakeOnLan !== undefined || d.alwaysReady !== undefined || d.alwaysReadyScreen !== undefined) {
    r.push(head(t('adv.power', 'Power')));
    if (d.quickBoot !== undefined)
      r.push(toggle(t('adv.quickBoot', 'Quick Boot'), d.quickBoot, 'quickBoot',
        t('adv.quickBoot.desc', 'Switching off puts the TV into a light sleep rather than shutting it down, so it comes back on faster. LG calls this Quick Start+.')));
    if (d.alwaysReady !== undefined)
      r.push(toggle(t('adv.stayConnected', 'Stay connected when off'), d.alwaysReady, 'alwaysReady',
        t('tv.options.stayConnected.hint', 'Keeps the TV on the network while it is switched off, apart from five hours each night, so Glasshouse and Home Assistant keep working. The screen stays dark. Uses about 12 W on an LG C2.')));
    if (d.alwaysReadyScreen !== undefined)
      r.push(toggle(t('adv.alwaysReady', 'Always Ready'), d.alwaysReadyScreen, 'alwaysReadyScreen',
        t('tv.options.alwaysReady.hint', 'Switched off with the remote, the TV shows LG\'s Always Ready screen, such as a clock or artwork, instead of going dark, from the next time it is switched off. Uses about 30 W on an LG C2, close to what it uses when on. Home turns the TV back on from the clock; the power button switches it fully off.')));
    // Only while it is on: with it off, the TV sleeps every night anyway.
    if (d.alwaysReady && d.alwaysReadyOff)
      r.push({ label: t('adv.nightlyOff', 'Nightly power-down'), value: d.alwaysReadyOff.start + '–' + d.alwaysReadyOff.end,
               cls: 'act', act: 'arOff', start: d.alwaysReadyOff.start,
               press: t('tv.options.nightlyPowerDown.press', 'Press OK to move it an hour later'),
               hint: t('tv.options.nightlyPowerDown.hint', 'For five hours every night, LG lets a switched-off TV sleep fully. It is offline then, so Glasshouse and Home Assistant cannot reach it. LG fixes the length; choose hours when the TV is not used.') });
    if (d.wakeOnLan !== undefined)
      r.push(toggle(t('adv.wol', 'Wake-on-LAN'), d.wakeOnLan, 'wakeOnLan',
        t('tv.options.wol.hint', 'Lets Home Assistant, a phone or another device on the network switch the TV on from standby. LG calls this Mobile TV On.')));
  }
  if (d.lgLogo !== undefined) {
    r.push(head(t('adv.display', 'Display')));
    var logo = toggle(t('adv.lgLogo', 'LG logo'), d.lgLogo, 'lgLogo',
      t('adv.lgLogo.desc', 'Shows the LG logo as the TV switches on and off. LG calls this LG Logo Display.'), t('tv.options.lgLogo.shown', 'Shown'), t('apps.tile.hidden', 'Hidden'));
    logo.press = d.lgLogo ? t('tv.options.lgLogo.hide', 'Press OK to hide it') : t('tv.options.lgLogo.show', 'Press OK to show it');
    r.push(logo);
  }
  if (d.deviceDetection !== undefined) {

/*
 * The lists a Privacy row opens. They replace the tab's rows until Back, or
 * the first row, returns to it. A switch that changes the TV reloads the list,
 * since LG ties some consents together and one can take others with it.
 */
var SUBLISTS = { consents: consentRows, services: serviceRows };
var sub = null, subFrom = 0;

function buildRows(section, d) {
  return (sub && section.key === 'privacy') ? SUBLISTS[sub](d) : (section.build(d) || []);
}

function openSub(key) {
  subFrom = sel;
  sub = key;
  rows = buildRows(T(), data[T().key]);
  sel = nextRow(firstSel());           // the first entry, past the way back
  render();
}

function closeSub() {
  sub = null;
  rows = T().build(data[T().key]) || [];
  sel = subFrom < rows.length ? subFrom : firstSel();
  render();
}

function nextRow(i) {
  do { i++; } while (i < rows.length && rows[i].head);
  return i < rows.length ? i : firstSel();
}

function backRow() {
  return { label: t('tv.backRow.privacy', '‹ Privacy'), value: '', act: 'close', press: t('tv.backRow.privacy.press', 'Press OK or Back to return'),
           hint: t('tv.backRow.privacy.hint', 'Back to the Privacy tab.') };
}

// Only the supervised services: an on-demand one starts whenever anything asks
// it a question, this dashboard included, so its state would say more about
// the asking than the TV.
function supervised(d) {
  return (d && d.daemons || []).filter(function (x) { return !x.onDemand; });
}

function consentRows(d) {
  if (!d || !d.ok || !d.consent) return [backRow()];
  var cw = d.consentWritable !== false;
  var flags = (d.consent.known || []).concat(d.consent.other || []);
  var groups = d.consentGroups || [['unknown', '']];
  var r = [backRow()];
  groups.forEach(function (g) {
    var inGroup = flags.filter(function (f) { return (f.group || 'unknown') === g[0]; });
    if (!inGroup.length) return;
    // Flags with no name and no agreement behind them are one row, not one
    // each: five rows saying the same nothing tell less than a count.
    var anon = g[0] === 'unknown' ? inGroup.filter(function (f) { return !f.settable && !f.documents; }) : [];

// ---- rendering ----

function rowHeight(r) { return (r && r.head ? HEAD_VH : ROW_VH) * window.innerHeight / 100; }

function render() {
  var box = document.getElementById('rows'), msg = document.getElementById('msg');
  if (!rows.length) {
    box.innerHTML = '';
    msg.style.display = 'block';
    var d = data[T().key];
    if (!d) {
      msg.innerHTML = esc(t('tv.loading', 'Loading…'));
    } else if (d.error) {
      var detail = '<div class="msg-detail">' + esc(d.error);
      if (lanOrigin) detail += '<br>' + esc(t('tv.msg.useWeb', 'Use the web dashboard instead:')) + ' <span class="msg-url">' + esc(lanOrigin) + '</span>';
      detail += '<br>' + esc(t('tv.msg.issue', 'If this persists, open an issue at github.com/rorygallagher2024/lg-webos-dashboard')) +
                '<br>' + esc(t('tv.msg.includeError', 'and include the error:')) + ' <span class="msg-url">' + esc(d.error) + '</span></div>';
      msg.innerHTML = esc(t('tv.msg.wentWrong', 'Something went wrong')) + detail;
    } else {
      msg.innerHTML = esc(t('tv.msg.nothing', 'Nothing to show here'));
    }
    return;
  }
  msg.style.display = 'none';
  box.innerHTML = rows.map(function (r, i) {
    if (r.head) return '<div class="row head"><span class="lbl">' + esc(r.label) + '</span></div>';
    return '<div class="row' + (i === sel ? ' sel' : '') + (r.act ? ' doable' : '') + '" onclick="pickRow(' + i + ')">' +
             '<span class="lbl">' + esc(r.label) + '</span>' +
             '<span class="val' + valClass(r) + '">' + esc(r.value) + '</span>' +
           '</div>';
  }).join('');
  position();
  renderHint();
}

/*
 * A row that cannot be pressed but reports a coloured state is a read-out, so
 * it takes the status label rather than the coloured value the toggles use:
 * otherwise "Capture: Stopped" looks exactly like a switch set to Stopped.
 */
var STATUS_OF = { on: 'good', warn: 'hold', bad: 'bad', off: 'note' };

function valClass(r) {
  if (!r.cls) return '';
  // A version number is a reading, and would not survive the capitals.
  if (!r.act && !r.plain && STATUS_OF[r.cls]) return ' st ' + STATUS_OF[r.cls];
  return ' ' + r.cls;
}

/*
 * The explainer for the selected row. Rows carry their own text; where one has
 * none the panel still says whether OK does anything, because that is the part
 * a reader cannot work out by looking.
 */
function renderHint() {
  var el = document.getElementById('hint');
  var r = rows[sel];
  if (!r || r.head) { el.className = ''; return; }
  document.getElementById('hintTitle').textContent = r.label;
  // The scan prompt is added only when there is a code to scan.
  document.getElementById('hintBody').textContent =
    (r.hint || '') + (renderQr(r) && r.scan ? ' ' + r.scan : '');
  var act = document.getElementById('hintAct');
  act.textContent = r.act ? (r.press || t('tv.press.change', 'Press OK to change')) : t('tv.viewOnly', 'View only');
  act.className = 'h-act' + (r.act ? '' : ' ro');
  el.className = 'on';
}

/* A row marked `web` can only be changed in a browser, so it offers a code to
   scan rather than an address to type on a remote. Drawn as one path of dark
   modules; an unreachable address or an over-long URL simply shows nothing. */
function renderQr(r) {
  var box = document.getElementById('hintQr');
  if (!r.web || !lanOrigin) { box.className = 'h-qr'; return false; }
  var url = lanOrigin + (r.web === true ? '/' : r.web);
  // The code carries the token so the phone can use the page; the address
  // printed beneath it leaves it out.
  var scan = lanKey ? url + (url.indexOf('?') < 0 ? '?' : '&') + 'k=' + encodeURIComponent(lanKey) : url;
  if (!qrDraw(document.getElementById('hintQrSvg'), scan)) { box.className = 'h-qr'; return false; }
  document.getElementById('hintUrl').textContent = url.replace(/^https?:\/\//, '');
  box.className = 'h-qr on';
  return true;
}

/* Headings are not landing places, so the selection skips over them and the
   offset is summed from real row heights rather than multiplied.
   The list is anchored to the top and only starts scrolling once the selection
   passes the middle, so a short section fills the screen from the top instead
   of floating in the centre with half the screen empty. */
function position() {
  var list = document.getElementById('list');
  var off = 0, total = 0, i;
  for (i = 0; i < rows.length; i++) {
    if (i < sel) off += rowHeight(rows[i]);
    total += rowHeight(rows[i]);
  }
  var centre = list.clientHeight / 2 - rowHeight(rows[sel]) / 2;
  var y = centre - off;
  var floor = Math.min(0, list.clientHeight - total);   // never scroll past the last row
  if (y > 0) y = 0;
  if (y < floor) y = floor;
  document.getElementById('rows').style.transform = 'translateY(' + y + 'px)';
  document.getElementById('moreUp').className = 'more' + (y < 0 ? ' on' : '');
  document.getElementById('moreDown').className = 'more' + (y > floor ? ' on' : '');
}

function firstSel() {
  for (var i = 0; i < rows.length; i++) if (!rows[i].head) return i;
  return 0;
}
function lastSel() {
  for (var i = rows.length - 1; i >= 0; i--) if (!rows[i].head) return i;
  return 0;
}

function move(d) {
  if (!rows.length) return;
  var i = sel;
  do { i += d; } while (i >= 0 && i < rows.length && rows[i].head);
  if (i < 0 || i >= rows.length) return;
  sel = i;
  render();
}

function pickRow(i) {
  if (i < 0 || i >= rows.length || rows[i].head) return;
  if (sel === i && rows[i].act) activate();
  else { sel = i; render(); }
}

function renderTabs() {
  var bar = document.getElementById('tabs');
  bar.innerHTML = TABS.map(function (section, i) {
    return '<div class="tab' + (i === tab ? ' on' : '') + '" data-label="' + esc(section.label) + '" onclick="openTab(' + i + ')">' +
      esc(section.label) + '</div>';
  }).join('');
  // More tabs than fit across the screen: scroll the bar to keep the selected
  // one in view, and fade whichever edge has tabs hidden beyond it.
  var on = bar.children[tab];
  var left = on.getBoundingClientRect().left - bar.getBoundingClientRect().left + bar.scrollLeft;
  if (left < bar.scrollLeft) bar.scrollLeft = left;
  else if (left + on.offsetWidth > bar.scrollLeft + bar.clientWidth) bar.scrollLeft = left + on.offsetWidth - bar.clientWidth;
  bar.className = (bar.scrollLeft > 0 ? 'clip-l ' : '') +
    (bar.scrollLeft + bar.clientWidth < bar.scrollWidth - 1 ? 'clip-r' : '');
}

function flash(text) {
  var el = document.getElementById('flash');
  el.textContent = text;
  el.className = 'on';
  if (flashTimer) clearTimeout(flashTimer);
  flashTimer = setTimeout(function () { el.className = ''; }, 2400);
}

// ---- data ----

function fetchTab(keepSel) {
  var section = T(), key = section.key;
  fetch(section.url, { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (T().key !== key) return;        // the user moved on while this was in flight
      data[key] = d;
      rows = buildRows(section, d);
      if (initialSel !== null && initialSel < rows.length && (!rows[initialSel] || !rows[initialSel].head)) {
        sel = initialSel;
        initialSel = null;
      } else if (!keepSel || sel >= rows.length || (rows[sel] && rows[sel].head)) {
        sel = firstSel();
      }
      render();
    })
    .catch(function () {
      if (T().key !== key || rows.length) return;
      document.getElementById('rows').innerHTML = '';
      var msg = document.getElementById('msg');
      msg.style.display = 'block';
      var detail = '<div class="msg-detail">' + esc(t('tv.msg.noResponse', 'The dashboard’s server on this TV did not respond.'));
      if (lanOrigin) detail += '<br>' + esc(t('tv.msg.useWeb', 'Use the web dashboard instead:')) + ' <span class="msg-url">' + esc(lanOrigin) + '</span>';
      detail += '<br>' + esc(t('tv.msg.issue', 'If this persists, open an issue at github.com/rorygallagher2024/lg-webos-dashboard')) + '</div>';
      msg.innerHTML = esc(t('tv.msg.unreachable', 'Could not reach the TV server')) + detail;
    });
}

function openTab(i, keepSel) {
  if (timer) { clearInterval(timer); timer = null; }
  tab = i;
  sub = null;
  if (!keepSel) sel = 0;
  rows = [];
  renderTabs();
  var cached = data[T().key];
  if (cached) {
    rows = T().build(cached) || [];
    if (!keepSel) sel = firstSel();
  }
  render();
  fetchTab(keepSel || !!cached);
  if (T().poll) timer = setInterval(function () { fetchTab(true); }, T().poll);
  if (T().key === 'update') checkUpdateOnOpen();
}

function checkUpdateOnOpen() {
  var d = data.update;
  if (busy || (d && d.writable === false) || (d && d.attemptedMs !== null && d.attemptedMs < 120000)) return;
  fetch('/api/control', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'updateCheck', value: 'open' })
  }).then(function (r) { return r.json().catch(function () { return {}; }); })
    .then(function (res) {
      if (T().key === 'update' && res && res.ok) {
        data.update = res;
        rows = updateRows(res) || [];
        render();
      }
    }).catch(function () {});
}

function switchTab(d) {
  var n = tab + d;
  if (n < 0 || n >= TABS.length) return;
  openTab(n);
}

// ---- actions ----

function awaitRestart(targetVer, doneLabel) {
  busy = true;
  var box = document.getElementById('rows'), msg = document.getElementById('msg');
  box.innerHTML = '';
  msg.style.display = 'block';
  msg.innerHTML = esc(t('tv.update.installingUpdate', 'Installing update…')) + '<div class="msg-detail">' + esc(t('tv.update.restartWait', 'The TV server is restarting. Please wait…')) + '</div>';

  var attempts = 0;
  var poll = setInterval(function () {
    attempts++;
    fetch('/api/update', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.ok) {
          if (!targetVer || d.installed === targetVer) {
            clearInterval(poll);
            busy = false;
            flash(doneLabel || t('tv.update.complete', 'Update complete'));
            setTimeout(function () {
              location.replace(location.pathname + '?tab=update&t=' + Date.now());
            }, 1000);
          }
        }
      })
      .catch(function () {});
    if (attempts > 80) {
      clearInterval(poll);
      busy = false;
      flash(t('tv.update.slow', 'Restart is taking longer than expected'));
      fetchTab(true);
    }
  }, 1500);
}

function send(body, note) {
  busy = true;
  fetch('/api/control', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function (r) { return r.json().catch(function () { return {}; }); })
    .then(function (res) {
      busy = false;
      if (res && res.ok === false) { flash(res.error || t('tv.failed', 'That did not work')); return fetchTab(true); }
      if (note) flash(note);
      fetchTab(true);
    })
    .catch(function () { busy = false; flash(t('tv.failed', 'That did not work')); });
}

function sendPost(url, body, note) {
  busy = true;
  fetch(url, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function (r) { return r.json().catch(function () { return {}; }); })
    .then(function (res) {
      busy = false;
      if (res && res.ok === false) { flash(res.error || t('tv.failed', 'That did not work')); return fetchTab(true); }
      if (note) flash(note);
      fetchTab(true);
    })
    .catch(function () { busy = false; flash(t('tv.failed', 'That did not work')); });
}

/*
 * Opening or closing the dashboard restarts the server to apply it, so wait for
 * it to answer again before showing the new state.
 */
function setNetwork(open) {
  busy = true;
  flash(open ? t('tv.net.opening', 'Opening it to your network…') : t('tv.net.closing', 'Keeping it to this TV…'));
  fetch('/api/setup', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'network', open: open })
  }).then(function (r) { return r.json().catch(function () { return {}; }); })
    .then(function (res) {
      if (res && res.ok === false) { busy = false; flash(res.error || t('tv.failed', 'That did not work')); return; }
      setTimeout(function () { untilBack(30); }, 1500);
    })
    .catch(function () { busy = false; flash(t('tv.failed', 'That did not work')); });
}

function untilBack(tries) {
  fetch('/api/setup', { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('not yet'); return r.json(); })
    .then(function () { busy = false; refreshCaps(); fetchTab(true); })
    .catch(function () {
      if (tries <= 0) { busy = false; flash(t('tv.net.notBack', 'It did not come back. Try again.')); return; }
      setTimeout(function () { untilBack(tries - 1); }, 1000);
    });
}

function activate() {
  if (busy || !rows.length) return;
  var r = rows[sel];
  if (!r || !r.act) return;
  switch (r.act) {
    case 'uninstall':
      if (!r.confirming) {
        r.confirming = true;
        r.origValue = r.value;
        r.origPress = r.press;
        r.origCls = r.cls;
        r.value = t('tv.confirm', 'Confirm?');
        r.cls = 'warn';
        r.press = t('tv.apps.uninstall.confirm', 'Press OK again to confirm uninstall');
        flash(t('tv.apps.uninstall.again', 'Press OK again to uninstall {name}', { name: r.title || r.key }));
        render();
        setTimeout(function () {
          if (r.confirming) {
            r.confirming = false;
            r.value = r.origValue;
            r.press = r.origPress;
            r.cls = r.origCls;
            render();
          }
        }, 4000);
        return;
      }
      r.confirming = false;
      r.value = t('apps.uninstall.working', 'Uninstalling…');
      r.cls = 'warn';
      flash(t('tv.apps.uninstalling', 'Uninstalling {name}…', { name: r.title || r.key }));
      render();
      return sendPost('/api/apps/uninstall', { id: r.key }, t('tv.apps.uninstalled', 'App uninstalled'));
    case 'tile':
      var ep = r.on ? '/api/apps/hide' : '/api/apps/unhide';
      r.value = r.on ? t('apps.tile.hiding', 'Hiding…') : t('tv.apps.tile.showing', 'Showing…');
      flash(r.on ? t('tv.apps.tile.hidingName', 'Hiding {name}…', { name: r.title || r.key }) : t('tv.apps.tile.showingName', 'Showing {name}…', { name: r.title || r.key }));
      render();
      return sendPost(ep, { id: r.key }, r.on ? t('tv.apps.tile.hidden', 'Tile hidden') : t('tv.apps.tile.visible', 'Tile visible'));
    case 'tileHiding':
      var nextHiding = !r.on;
      r.value = nextHiding ? t('tv.enabling', 'Enabling…') : t('tv.disabling', 'Disabling…');
      flash(nextHiding ? t('tv.apps.tiles.enabling', 'Enabling tile hiding…') : t('tv.apps.tiles.disabling', 'Disabling tile hiding…'));
      render();
      return sendPost('/api/apps/tile-hiding', { enabled: nextHiding }, nextHiding ? t('tv.apps.tiles.enabled', 'Tile hiding enabled') : t('tv.apps.tiles.disabled', 'Tile hiding disabled'));
    case 'serviceToggle':
      var nextDisabled = r.on;
      r.value = nextDisabled ? t('tv.disabling', 'Disabling…') : t('tv.enabling', 'Enabling…');
      flash(nextDisabled ? t('tv.apps.service.disablingName', 'Disabling {name}…', { name: r.title || r.key }) : t('tv.apps.service.enablingName', 'Enabling {name}…', { name: r.title || r.key }));
      render();
      return sendPost('/api/services/toggle', { id: r.key, disabled: nextDisabled }, nextDisabled ? t('tv.apps.service.disabled', 'Service disabled') : t('tv.apps.service.enabled', 'Service enabled'));
    case 'oled':
      return send({ action: 'oledProtection', value: { key: r.key, enabled: !r.on } },
                  r.on ? t('tv.flash.switchedOff', 'Switched off') : t('tv.flash.switchedOn', 'Switched on'));
    case 'shift':
      return send({ action: 'screenShift', value: r.on ? 'off' : 'on' });
    case 'arOff':
      var nextHour = (parseInt(r.start, 10) + 1) % 24;
      return send({ action: 'alwaysReadyOffStart', value: nextHour },
                  t('tv.options.nightlyOff.moved', '{start} to {end}', { start: (nextHour < 10 ? '0' : '') + nextHour + ':00', end: ((nextHour + 5) % 24 < 10 ? '0' : '') + (nextHour + 5) % 24 + ':00' }));
    case 'logo':
      // off -> light -> strong -> off
      var next = r.cur === 'off' ? 'light' : (r.cur === 'light' ? 'strong' : 'off');
      return send({ action: 'logoDimming', value: next });
    case 'refresh':
      return send({ action: 'refresherSchedule' }, t('tv.oled.refresherScheduled', 'Refresher scheduled'));
    case 'refreshCancel':
      return send({ action: 'refresherCancel' }, t('tv.oled.refresherCancelled', 'Refresher cancelled'));
    case 'saver':
      return send({ action: 'screensaverMode', value: r.key });
    case 'saverLevel':
      return send({ action: 'screensaverMode', value: { mode: r.key, level: r.next } },
                  r.next === 'bright' ? t('ss.bright', 'Bright') : t('ss.dim', 'Dim'));
    case 'saverStart':
      return startSaverAfterRelease();
    case 'quickBoot':
      return send({ action: 'quickBoot', value: !r.on }, r.on ? t('tv.flash.quickBootOff', 'Quick Boot turned off') : t('tv.flash.quickBootOn', 'Quick Boot turned on'));
    case 'deviceDetection':
      return send({ action: 'deviceDetection', value: !r.on }, r.on ? t('tv.flash.detectionOff', 'Device detection turned off') : t('tv.flash.detectionOn', 'Device detection turned on'));
    case 'alwaysReady':
      return send({ action: 'alwaysReady', value: !r.on }, r.on ? t('tv.flash.willSleep', 'Will sleep when off') : t('tv.flash.willStay', 'Will stay connected when off'));
    case 'alwaysReadyScreen':
      return send({ action: 'alwaysReadyScreen', value: !r.on }, r.on ? t('tv.flash.alwaysReadyOff', 'Always Ready turned off') : t('tv.flash.alwaysReadyOn', 'Always Ready turned on'));
    case 'lgLogo':
      return send({ action: 'lgLogo', value: !r.on }, r.on ? t('tv.flash.logoHidden', 'LG logo hidden') : t('tv.flash.logoShown', 'LG logo shown'));
    case 'wakeOnLan':
      return send({ action: 'wakeOnLan', value: !r.on }, r.on ? t('tv.flash.wolOff', 'Wake-on-LAN turned off') : t('tv.flash.wolOn', 'Wake-on-LAN turned on'));
    case 'standbyLight':
      return send({ action: 'standbyLight', value: !r.on }, r.on ? t('tv.flash.standbyOff', 'Standby light turned off') : t('tv.flash.standbyOn', 'Standby light turned on'));
    case 'logoLight':
      return send({ action: 'logoLight', value: !r.on }, r.on ? t('tv.flash.logoLightOff', 'Logo light turned off') : t('tv.flash.logoLightOn', 'Logo light turned on'));
    case 'adblock':
      return send({ action: 'setAdBlock', value: r.key });
    case 'acr':
      return send({ action: 'acr', value: !r.on }, r.on ? t('tv.flash.switchedOff', 'Switched off') : t('tv.flash.switchedOn', 'Switched on'));
    case 'open':
      return openSub(r.key);
    case 'close':
      return closeSub();
    case 'consent':
      return send({ action: 'consent', value: { key: r.key, enabled: !r.on } },
                  r.on ? t('tv.flash.switchedOff', 'Switched off') : t('tv.flash.switchedOn', 'Switched on'));
    case 'resetAdId':
      return send({ action: 'resetAdId' }, t('tv.flash.adIdReset', 'Advertising ID reset'));
    case 'allOff':
      flash(t('pv.switchingOff', 'Switching off…'));
      return send({ action: 'privacyAllOff' }, t('tv.flash.switchedOff', 'Switched off'));
    case 'lmt':
      return send({ action: 'limitAdTracking', value: !r.on }, r.on ? t('tv.flash.switchedOff', 'Switched off') : t('tv.flash.switchedOn', 'Switched on'));
    case 'tvupd':
      return send({ action: 'blockTvUpdates', value: !r.on }, r.on ? t('tv.flash.updatesAllowed', 'Updates allowed') : t('tv.flash.updatesBlocked', 'Updates blocked'));
    case 'lock':
      return send({ action: 'serviceMenuLock', value: { locked: !r.on } });
    case 'menu':
      return send({ action: 'serviceMenuOpen', value: { menu: r.key } }, t('tv.flash.opening', 'Opening…'));
    case 'net':
      return setNetwork(!r.on);
    case 'ha':
      return location.assign('/assets/setup.html#ha');
    case 'toggleTheme':
      var nextTheme = currentTheme === 'light' ? 'dark' : 'light';
      applyTheme(nextTheme);
      try { localStorage.setItem('theme', nextTheme); } catch (e) {}
      flash(nextTheme === 'light' ? t('tv.flash.themeLight', 'Theme: Light') : t('tv.flash.themeDark', 'Theme: Dark'));
      if (T().key === 'settings') {
        rows = settingsRows(data.settings || {});
        render();
      }
      return;
    case 'updateCheck':
      r.value = t('tv.update.checking', 'Checking…');
      r.cls = 'warn';
      render();
      flash(t('tv.update.checkingFlash', 'Checking for updates…'));
      return sendPost('/api/control', { action: 'updateCheck' }, t('tv.update.checked', 'Check complete'));
    case 'update':
      if (!r.confirming) {
        r.confirming = true;
        r.origValue = r.value;
        r.origPress = r.press;
        r.origCls = r.cls;
        r.value = t('tv.confirm', 'Confirm?');
        r.cls = 'warn';
        r.press = t('tv.update.installAgain', 'Press OK again to install v{version}', { version: r.targetVer });
        flash(r.press);
        render();
        setTimeout(function () {
          if (r.confirming) {
            r.confirming = false;
            r.value = r.origValue;
            r.press = r.origPress;
            r.cls = r.origCls;
            render();
          }
        }, 4000);
        return;
      }
      r.confirming = false;
      r.value = t('tv.update.installing', 'Installing…');
      r.cls = 'warn';
      render();
      flash(t('tv.update.installingVersion', 'Installing v{version}…', { version: r.targetVer }));
      busy = true;
      fetch('/api/control', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'update' })
      }).then(function (res) { return res.json().catch(function () { return {}; }); })
        .then(function (res) {
          if (res && res.ok === false) {
            busy = false;
            flash(res.error || t('server.updateFailed', 'The update failed.'));
            return fetchTab(true);
          }
          awaitRestart(r.targetVer, t('server.step.updated', 'Updated to v{version}', { version: r.targetVer }));
        })
        .catch(function () {
          awaitRestart(r.targetVer, t('server.step.updated', 'Updated to v{version}', { version: r.targetVer }));
        });
      return;
    case 'updateRollback':
      if (!r.confirming) {
        r.confirming = true;
        r.origValue = r.value;
        r.origPress = r.press;
        r.origCls = r.cls;
        r.value = t('tv.confirm', 'Confirm?');
        r.cls = 'warn';
        r.press = t('tv.update.rollbackAgain', 'Press OK again to roll back to v{version}', { version: r.targetVer });
        flash(r.press);
        render();
        setTimeout(function () {
          if (r.confirming) {
            r.confirming = false;
            r.value = r.origValue;
            r.press = r.origPress;
            r.cls = r.origCls;
            render();
          }
        }, 4000);
        return;
      }
      r.confirming = false;
      r.value = t('tv.update.rollingBack', 'Rolling back…');
      r.cls = 'warn';
      render();
      flash(t('tv.update.rollingBackVersion', 'Rolling back to v{version}…', { version: r.targetVer }));
      busy = true;
      fetch('/api/control', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'updateRollback' })
      }).then(function (res) { return res.json().catch(function () { return {}; }); })
        .then(function (res) {
          if (res && res.ok === false) {
            busy = false;
            flash(res.error || t('server.rollbackFailed', 'The rollback failed.'));
            return fetchTab(true);
          }
          awaitRestart(r.targetVer, t('server.step.rolledBack', 'Rolled back to v{version}', { version: r.targetVer }));
        })
        .catch(function () {
          awaitRestart(r.targetVer, t('server.step.rolledBack', 'Rolled back to v{version}', { version: r.targetVer }));
        });
      return;
  }
}

// ---- keys ----

/*
 * The app declares disableBackHistoryAPI, so Back is delivered to this page
 * rather than handled by the system, and ignoring it left Back doing nothing.
 * There is no screen to step back to, so it leaves the app as Back does
 * everywhere else on the TV. platformBack is webOS's own Back; window.close
 * covers the page being opened somewhere other than the app.
 */
// Back only sends a webOS app to the background, and opening it again from the
// home screen resumes the page as it was. Reload instead, on the same tab, so
// a server updated in the meantime shows its current dashboard.
document.addEventListener('webOSRelaunch', function () {
  location.replace(location.pathname + '?tab=' + T().key + '&t=' + Date.now());
});

function leaveApp() {
  if (window.PalmSystem && typeof window.PalmSystem.platformBack === 'function') {
    window.PalmSystem.platformBack();
  } else {
    window.close();
  }
}

/*
 * The screen saver ends on any button, and OK acts on the key going down: the
 * release of that same press reached it and ended it, 145ms after it showed
 * on a C2. So it starts once OK is let go, with a moment's grace, or after a
 * second if no release comes (a click, or a remote that sends none).
 */
var saverPending = null;
function startSaverAfterRelease() {
  if (saverPending) return;
  flash(t('tv.flash.startingSaver', 'Starting the screen saver…'));
  function go() {
    if (!saverPending) return;
    clearTimeout(saverPending);
    saverPending = null;
    setTimeout(function () { send({ action: 'screensaver' }); }, 300);
  }
  saverPending = setTimeout(go, 1000);
  document.addEventListener('keyup', function once() {
    document.removeEventListener('keyup', once);
    go();
  });
}

document.addEventListener('keydown', function (e) {
  var k = e.key, c = e.keyCode;

  // Inside a list opened from a row, Left goes back up to it rather than to
  // another tab, and Right has nowhere to go.
  if      (c === 37 || k === 'ArrowLeft')  { if (sub) closeSub(); else switchTab(-1); e.preventDefault(); }
  else if (c === 39 || k === 'ArrowRight') { if (!sub) switchTab(1); e.preventDefault(); }
  else if (c === 38 || k === 'ArrowUp')    { move(-1);      e.preventDefault(); }
  else if (c === 40 || k === 'ArrowDown')  { move(1);       e.preventDefault(); }
  else if (c === 13 || k === 'Enter')      { activate();    e.preventDefault(); }
  else if (c === 461 || k === 'GoBack' || k === 'BrowserBack') { if (sub) closeSub(); else leaveApp(); e.preventDefault(); }
});
window.addEventListener('resize', function () { if (rows.length) position(); });

renderTabs();
var initTab = 0;
var match = location.search.match(/[?&]tab=([^&]+)/);
if (match) {
  var wanted = decodeURIComponent(match[1]).toLowerCase();
  for (var ti = 0; ti < TABS.length; ti++) {
    if (TABS[ti].key === wanted) { initTab = ti; break; }
  }
}
var selMatch = location.search.match(/[?&]sel=([^&]+)/);
if (selMatch) {
  var pSel = parseInt(selMatch[1], 10);
  if (!isNaN(pSel)) {
    sel = pSel;
    initialSel = pSel;
  }
}
openTab(initTab, initialSel !== null);
</script>
