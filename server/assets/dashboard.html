<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Dashboard Server</title>
<style>
/* The dashboard as it appears on the TV itself, driven by the remote.
   Left/Right flips between sections, Up/Down moves within one, Enter acts on
   the selected row. Outfit for headings (the spectacle face), Manrope for the
   rows, on true black. Sized for 1080p viewed from the sofa, which is why the
   type is large and the palette is opacity steps rather than colour. */
@font-face{font-family:'Outfit';src:url('/assets/fonts/Outfit-Light.ttf') format('truetype');font-weight:300;font-display:swap}
@font-face{font-family:'Outfit';src:url('/assets/fonts/Outfit-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'Manrope';src:url('/assets/fonts/Manrope-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'Manrope';src:url('/assets/fonts/Manrope-SemiBold.ttf') format('truetype');font-weight:600;font-display:swap}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;overflow:hidden}
body{font-family:'Manrope',sans-serif;color:#fff;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;
  /* the remote drives it; there is no pointer */ cursor:none}

#stage{height:100vh;display:flex;flex-direction:column;padding:5vh 0 5vh 8vw}

#clock{font-family:'Manrope',sans-serif;font-weight:400;font-size:4.4vh;letter-spacing:.01em;
  line-height:1;opacity:.65;flex:0 0 auto;margin-bottom:3.4vh}

#tabs{display:flex;display:-webkit-flex;align-items:baseline;-webkit-align-items:baseline;flex:0 0 auto;margin:0 4vw 3.2vh 0;
  /* the bar clips so it can scroll, and at line-height 1 that takes the tails
     of g and y with it; the padding makes room and the margin gives it back */
  padding-bottom:1.2vh;white-space:nowrap;overflow:hidden}
#tabs.clip-r{-webkit-mask-image:linear-gradient(to right,#000 88%,transparent);mask-image:linear-gradient(to right,#000 88%,transparent)}
#tabs.clip-l{-webkit-mask-image:linear-gradient(to left,#000 88%,transparent);mask-image:linear-gradient(to left,#000 88%,transparent)}
#tabs.clip-l.clip-r{-webkit-mask-image:linear-gradient(to right,transparent,#000 12%,#000 88%,transparent);
  mask-image:linear-gradient(to right,transparent,#000 12%,#000 88%,transparent)}
.tab{display:inline-block;font-family:'Manrope',sans-serif;font-weight:400;font-size:4.2vh;line-height:1;letter-spacing:.01em;
  color:rgba(255,255,255,.50);transition:color .22s ease;white-space:nowrap;
  flex:0 0 auto;-webkit-flex:0 0 auto;padding-right:2.8vw;cursor:pointer}
.tab:last-child{padding-right:0}
/* A hidden bold copy sets each tab's width, so selecting one (which bolds it)
   does not push the tabs after it along. */
.tab::after{content:attr(data-label);display:block;font-weight:600;height:0;overflow:hidden;visibility:hidden}
.tab.on{color:#fff;font-weight:600}

/* Two columns: the rows on the left, an explainer for whichever row is selected
   on the right. A row's label and value never needed the full width, and the
   space buys somewhere to say what a setting means without a second screen. */
#main{flex:1 1 auto;display:flex;overflow:hidden;padding-right:4vw;min-height:0}
#list{flex:1 1 62%;overflow:hidden;position:relative}
#rows{position:absolute;left:0;right:0;transition:transform .28s cubic-bezier(.4,0,.2,1)}

#hint{flex:0 0 31%;margin-left:2.6vw;align-self:center;border-left:1px solid rgba(255,255,255,.14);
  padding-left:2.4vw;opacity:0;transition:opacity .22s ease}
#hint.on{opacity:1}
.h-title{font-family:'Manrope',sans-serif;font-weight:600;font-size:3.4vh;line-height:1.15;
  letter-spacing:.005em;margin-bottom:1.6vh}
.h-body{font-family:'Manrope',sans-serif;font-weight:400;font-size:2.1vh;line-height:1.65;
  color:rgba(255,255,255,.68)}
/* What OK does here, or that it does nothing. Green only when there is
   something to press, so the colour itself carries the distinction. */
.h-act{font-family:'Manrope',sans-serif;font-weight:600;font-size:1.7vh;letter-spacing:.14em;
  text-transform:uppercase;margin-top:2.4vh;color:#1ec15f}
.h-act.ro{color:rgba(255,255,255,.50)}

/* For the few rows that can only be changed in a browser: a code to scan and
   the address under it, so the dashboard can be opened without typing an
   address on a remote. White on black would invert the code, so it sits on a
   white tile with its own quiet zone. */
.h-qr{margin-top:2.4vh;display:none}
.h-qr.on{display:block}
.h-qr svg{width:15vh;height:15vh;display:block;background:#fff;padding:1vh;border-radius:.6vh}
.h-url{font-family:'Manrope',sans-serif;font-weight:400;font-size:1.6vh;letter-spacing:.01em;
  color:rgba(255,255,255,.55);margin-top:1.2vh;word-break:break-all}

/* A row is a label and its value. Only the selected one is full white and
   slightly enlarged; the rest recede, so the eye lands on the choice. */
/* The right padding is the scroll arrows' lane, so a long value never runs
   underneath one. */
.row{display:flex;align-items:baseline;justify-content:space-between;height:7.6vh;
  padding-right:3.4vw;
  opacity:.55;transition:opacity .22s ease,transform .22s ease;
  transform-origin:left center}
.row:not(.head){cursor:pointer}
.row.sel{opacity:1;transform:scale(1.03)}
.lbl{font-family:'Manrope',sans-serif;font-weight:500;font-size:3.1vh;letter-spacing:.01em}
.val{font-family:'Manrope',sans-serif;font-weight:400;font-size:3.1vh;color:rgba(255,255,255,.75);
  text-align:right;white-space:nowrap;padding-left:2vw}
.row.sel .val{font-weight:600;color:rgba(255,255,255,.90)}
.val.on{color:#1ec15f}
.val.off{color:rgba(255,255,255,.45)}
.val.bad{color:#e65050}
.val.warn{color:#ff9800}
.val.act{color:rgba(255,255,255,.50)}
.row.sel .val.act{color:#1ec15f}
.row.sel .val.bad{color:#ff6b6b}
.row.sel .val.warn{color:#ffb74d}

/* The mark that separates a row you can press from one you can only read. It
   sits in a gutter every row reserves, so nothing shifts as the eye moves down
   and the pressable ones line up as a column of their own. */
.lbl::before{content:'';display:inline-block;width:.9vh;height:.9vh;
  border-radius:50%;margin-right:1.6vh;vertical-align:middle;
  background:transparent;transition:background .22s ease}
.row.doable .lbl::before{background:rgba(255,255,255,.45)}
.row.doable.sel .lbl::before{background:#1ec15f}

/* A heading inside the list - groups rows without being selectable itself. */
.row.head{height:5.4vh;opacity:1;transform:none}
.row.head .lbl{font-family:'Manrope';font-weight:600;font-size:1.5vh;letter-spacing:.24em;
  text-transform:uppercase;color:rgba(255,255,255,.55)}
.row.head .lbl::before{display:none}

#msg{position:absolute;top:50%;left:0;transform:translateY(-50%);
  font-family:'Manrope',sans-serif;font-weight:400;font-size:4vh;color:rgba(255,255,255,.8)}
#msg .msg-detail{font-family:'Manrope',sans-serif;font-weight:400;font-size:2vh;line-height:1.8;
  color:rgba(255,255,255,.6);margin-top:2.2vh}
#msg .msg-url{color:rgba(255,255,255,.75)}

/* In the lane the rows leave clear on the right, so neither the labels nor the
   values ever run underneath one. */
.more{position:absolute;right:0;font-family:'Manrope',sans-serif;font-size:2.4vh;
  color:rgba(255,255,255,.50);opacity:0;transition:opacity .2s;pointer-events:none}
.more.on{opacity:1}
#moreUp{top:0}
#moreDown{bottom:0}

/* Shown briefly after an action so a press that changes something off-screen
   (opening the service menu, scheduling a refresher) still acknowledges. */
#flash{position:absolute;right:8vw;bottom:5vh;font-family:'Manrope',sans-serif;font-weight:400;
  font-size:2.2vh;color:rgba(255,255,255,.85);opacity:0;transition:opacity .3s}
#flash.on{opacity:1}

/* ---- light theme ---- */
body.light, html.light{background:#f5f5f5;color:#111}
body.light #clock{color:#000;opacity:.7}
body.light .tab{color:rgba(0,0,0,.52)}
body.light .tab.on{color:#000;font-weight:600}
body.light #hint{border-left-color:rgba(0,0,0,.15)}
body.light .h-title{color:#000}
body.light .h-body{color:rgba(0,0,0,.78)}
body.light .h-act{color:#15803d}
body.light .h-act.ro{color:rgba(0,0,0,.50)}
body.light .h-qr svg{border:1px solid rgba(0,0,0,.15)}
body.light .h-url{color:rgba(0,0,0,.65)}
body.light .row{opacity:.62}
body.light .row.sel{opacity:1}
body.light .row.sel .lbl{color:#000;font-weight:600}
body.light .val{color:rgba(0,0,0,.70)}
body.light .row.sel .val{color:rgba(0,0,0,.92);font-weight:600}
body.light .val.on{color:#15803d}
body.light .val.off{color:rgba(0,0,0,.48)}
body.light .val.bad{color:#dc2626}
body.light .val.warn{color:#b45309}
body.light .val.act{color:rgba(0,0,0,.52)}
body.light .row.sel .val.act{color:#15803d}
body.light .row.sel .val.bad{color:#dc2626}
body.light .row.sel .val.warn{color:#b45309}
body.light .row.doable .lbl::before{background:rgba(0,0,0,.38)}
body.light .row.doable.sel .lbl::before{background:#15803d}
body.light .row.head .lbl{color:rgba(0,0,0,.62)}
body.light #msg{color:rgba(0,0,0,.8)}
body.light #msg .msg-detail{color:rgba(0,0,0,.65)}
body.light #msg .msg-url{color:rgba(0,0,0,.85)}
body.light .more{color:rgba(0,0,0,.50)}
body.light #flash{color:rgba(0,0,0,.88)}
</style>
</head>
<body>
<div id="stage">
  <div id="clock">--:--</div>
  <nav id="tabs"></nav>
  <div id="main">
    <div id="list">
      <div id="msg">Loading&hellip;</div>
      <div class="more" id="moreUp">&#9650;</div>
      <div id="rows"></div>
      <div class="more" id="moreDown">&#9660;</div>
    </div>
    <aside id="hint">
      <div class="h-title" id="hintTitle"></div>
      <div class="h-body" id="hintBody"></div>
      <div class="h-act" id="hintAct"></div>
      <div class="h-qr" id="hintQr"><svg id="hintQrSvg" viewBox="0 0 33 33" shape-rendering="crispEdges"></svg><div class="h-url" id="hintUrl"></div></div>
    </aside>
  </div>
  <div id="flash"></div>
</div>
<script src="/assets/qr.js"></script>
<script>
/* Every section reads an endpoint the server already serves to the browser
   dashboard, so nothing here needs its own API. A section is a tab; its rows
   are built from that payload by its own builder below. */
var TABS = [
  { key: 'system',  label: 'System',       url: '/api/stats',       build: sysRows,  poll: 5000 },
  { key: 'apps',    label: 'Apps',         url: '/api/apps',        build: appsRows },
  { key: 'oled',    label: 'OLED Care',    url: '/api/oledcare',    build: oledRows },
  { key: 'saver',   label: 'Screen Saver', url: '/api/screensaver', build: saverRows },
  { key: 'privacy', label: 'Privacy',      url: '/api/privacy',     build: privacyRows },
  { key: 'service', label: 'Service Menu', url: '/api/servicemenu', build: svcRows },
  { key: 'update',  label: 'Updates',      url: '/api/update',      build: updateRows },
  { key: 'settings', label: 'Settings',    url: '/api/setup',       build: settingsRows }
];

var tab = 0, sel = 0, busy = false, ROW_VH = 7.6, HEAD_VH = 5.4;
var initialSel = null;
/* Where a phone can reach this server. Only the server knows it - the app is
   served from localhost - so it is asked for once and kept. */
var lanOrigin = null, lanKey = null;
function refreshCaps() {
  fetch('/api/caps', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      // A new install walks through setup first - but only in the TV app: a
      // phone's browser cannot use those screens.
      if (d && d.setupNeeded && window.PalmSystem) return location.replace('/assets/setup.html');
      lanOrigin = (d && d.origin) || null;
      lanKey = (d && d.key) || null;
      renderHint();
    })
    .catch(function () {});
}
refreshCaps();
var data = {}, rows = [], timer = null, flashTimer = null;
var currentTheme = 'dark';
try {
  var urlTheme = (location.search.match(/[?&]theme=([^&]+)/) || [])[1];
  currentTheme = urlTheme || localStorage.getItem('theme') || 'dark';
} catch (e) { currentTheme = 'dark'; }

function applyTheme(t) {
  currentTheme = t === 'light' ? 'light' : 'dark';
  if (document.documentElement) {
    document.documentElement.className = currentTheme === 'light' ? 'light' : '';
  }
  if (document.body) {
    document.body.className = currentTheme === 'light' ? 'light' : '';
  }
}
applyTheme(currentTheme);

function T() { return TABS[tab]; }

function tick() {
  var d = new Date(), h = d.getHours(), m = d.getMinutes();
  document.getElementById('clock').textContent =
    (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
}
setInterval(tick, 10000); tick();

function esc(s) { return String(s).replace(/[&<>"]/g, function(c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

function num(n) {
  if (n === null || n === undefined) return '—';
  return Number(n).toLocaleString();
}

function fmtKB(kb) {
  if (!kb && kb !== 0) return '—';
  if (kb >= 1048576) return (kb / 1048576).toFixed(1) + ' GB';
  return Math.round(kb / 1024) + ' MB';
}

function fmtUptime(sec) {
  var d = Math.floor(sec / 86400), h = Math.floor((sec % 86400) / 3600),
      m = Math.floor((sec % 3600) / 60);
  return d > 0 ? d + 'd ' + h + 'h' : h + 'h ' + m + 'm';
}

/* The server returns some values with their unit already attached and some
   without, so strip a trailing unit before adding one rather than printing
   "120 Hz Hz". Percent sits tight against its number; the rest take a space. */
function withUnit(v, unit) {
  if (v === null || v === undefined || v === '') return '—';
  var re = new RegExp('\\s*' + unit.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '$', 'i');
  return String(v).replace(re, '') + (unit === '%' ? '' : ' ') + unit;
}

function head(label) { return { label: label, head: true }; }

// ---- row builders, one per section ----

function sysRows(d) {
  if (!d || !d.ok) return [];
  var r = [];
  r.push(head('Load'));
  if (d.temp !== null && d.temp !== undefined) r.push({ label: 'Temperature', value: withUnit(d.temp, '°C'),
    hint: 'The main processor (SoC) sensor, not the panel. It climbs with video decoding and CPU workload.' });
  if (d.load !== null && d.load !== undefined) r.push({ label: 'CPU load', value: withUnit(d.load, '%'),
    hint: 'Across all cores. Brief peaks while an app opens are normal; a sustained high figure with nothing playing is not.' });
  if (d.mhz) r.push({ label: 'CPU frequency', value: withUnit(d.mhz, 'MHz'),
    hint: 'The current clock. It drops when the TV is idle and rises under load.' });
  if (d.gpuMhz) r.push({ label: 'GPU clock', value: withUnit(d.gpuMhz, 'MHz'),
    hint: 'Drives the interface and video scaling.' });
  if (d.cores && d.cores.length)
    r.push({ label: 'Per-core load', value: d.cores.map(function (c) { return c + '%'; }).join('  '),
      hint: 'One figure per core. An even spread is healthy; one core pinned while the rest idle points at a stuck process.' });

  r.push(head('Memory and storage'));
  if (d.mem) r.push({ label: 'Memory free', value: fmtKB(d.mem.avail) + ' of ' + fmtKB(d.mem.total),
    hint: 'Free memory is expected to be low: webOS keeps apps loaded so they reopen quickly, and releases them under pressure.' });
  if (d.swap && d.swap.total) r.push({ label: 'Swap free', value: fmtKB(d.swap.free) + ' of ' + fmtKB(d.swap.total),
    hint: 'Compressed memory held in RAM rather than on disk, so heavy use costs speed but does not wear the storage.' });
  if (d.emmc && d.emmc.health) r.push({ label: 'eMMC health', value: d.emmc.health,
    hint: 'Life left in the built-in storage, as the chip itself reports it. It falls very slowly and cannot be reset.' });

  r.push(head('This TV'));
  if (d.device && d.device.model) r.push({ label: 'Model', value: d.device.model });
  if (d.system && d.system.firmware) r.push({ label: 'Firmware', value: d.system.firmware });
  if (d.system && d.system.webos) r.push({ label: 'webOS', value: String(d.system.webos) });
  if (d.hardware && d.hardware.soc_arch) r.push({ label: 'SoC', value: d.hardware.soc_arch });
  if (d.hardware && d.hardware.ram) r.push({ label: 'RAM', value: d.hardware.ram });
  if (d.hardware && d.hardware.refresh_rate) r.push({ label: 'Panel refresh', value: withUnit(d.hardware.refresh_rate, 'Hz') });
  if (d.uptime) r.push({ label: 'Uptime', value: fmtUptime(d.uptime) });
  if (d.remote && d.remote.battery !== null && d.remote.battery !== undefined)
    r.push({ label: 'Remote battery', value: withUnit(d.remote.battery, '%') });
  if (d.ssid) r.push({ label: 'Wi-Fi', value: d.ssid });

  if (d.quickBoot !== undefined || (d.lights && d.lights.standby !== undefined)) {
    r.push(head('Power'));
    if (d.quickBoot !== undefined) {
      r.push({
        label: 'Quick Boot',
        value: d.quickBoot ? 'On' : 'Off',
        cls: 'act',
        act: 'quickBoot',
        on: !!d.quickBoot,
        press: 'Press OK to turn ' + (d.quickBoot ? 'off' : 'on'),
        hint: 'Quick Start+ puts the TV into instant standby so it wakes in <2s instead of performing a ~25s cold boot.'
      });
    }
    if (d.lights && d.lights.standby !== undefined) {
      r.push({
        label: 'Standby LED',
        value: d.lights.standby ? 'On' : 'Off',
        cls: 'act',
        act: 'standbyLight',
        on: !!d.lights.standby,
        press: 'Press OK to turn ' + (d.lights.standby ? 'off' : 'on'),
        hint: 'Controls whether the front standby LED stays lit when the TV is turned off.'
      });
    }
  }

  return r;
}

function appearanceRows() {
  return [head('Appearance'), {
    label: 'Theme',
    value: currentTheme === 'light' ? 'Light' : 'Dark',
    cls: 'act',
    act: 'toggleTheme',
    press: 'Press OK to switch to ' + (currentTheme === 'light' ? 'Dark' : 'Light') + ' theme',
    hint: 'Switches the dashboard interface between Dark (true black for OLED) and Light theme.'
  }];
}

function oledRows(d) {
  if (!d || !d.ok) return [];
  if (!d.isOled) return [{ label: 'This is not an OLED panel', value: '' }];
  var canSet = d.writable && d.serviceControls;
  var r = [];

  r.push(head('Panel life'));
  if (d.panelHours !== null && d.panelHours !== undefined)
    r.push({ label: 'Total power-on hours', value: num(d.panelHours),
      hint: 'Hours the panel has been lit since new. The figure the maintenance cycles below are scheduled against.' });
  if (d.hoursUntilComp !== null && d.hoursUntilComp !== undefined)
    r.push({ label: 'Panel maintenance in', value: withUnit(Math.round(d.hoursUntilComp), 'h'),
      hint: 'The short compensation pass, run roughly every four hours of use. It happens by itself after the TV is switched off.' });
  if (d.hoursUntilRefresher !== null && d.hoursUntilRefresher !== undefined)
    r.push({ label: 'Pixel refresher in', value: withUnit(Math.round(d.hoursUntilRefresher), 'h'),
      hint: 'The long calibration, due about every 2,000 hours. It takes around an hour and runs once the TV is off.' });
  if (d.compCycles !== null && d.compCycles !== undefined)
    r.push({ label: 'Short cycles completed', value: num(d.compCycles),
      hint: 'How many short compensation passes the panel has run.' });
  if (d.refresherCycles !== null && d.refresherCycles !== undefined)
    r.push({ label: 'Pixel refresher cycles', value: num(d.refresherCycles),
      hint: 'How many long calibrations the panel has run. These are the ones that matter for wear.' });
  if (d.gsrStressCount !== null && d.gsrStressCount !== undefined)
    r.push({ label: 'GSR stress events', value: num(d.gsrStressCount),
      hint: 'How often sticky reduction has had to step in. A rising count means static content is being shown for long stretches.' });

  r.push(head('Protections'));
  if (d.gsr !== null && d.gsr !== undefined)
    r.push({ label: 'Global sticky reduction', value: d.gsr ? 'On' : 'Off', cls: d.gsr ? 'on' : 'off',
             act: canSet ? 'oled' : null, key: 'gsr', on: d.gsr, guard: true,
             press: d.gsr ? 'Press OK to switch off' : 'Press OK to switch on',
             hint: 'Dims static content - channel logos, scoreboards, menu bars - so it does not burn in. Switching it off makes permanent image retention more likely.' });
  if (d.tpc !== null && d.tpc !== undefined)
    r.push({ label: 'Temporal peak control', value: d.tpc ? 'On' : 'Off', cls: d.tpc ? 'on' : 'off',
             act: canSet ? 'oled' : null, key: 'tpc', on: d.tpc, guard: true,
             press: d.tpc ? 'Press OK to switch off' : 'Press OK to switch on',
             hint: 'Limits how long the panel holds peak brightness, which protects it and keeps heat down. Switching it off makes burn-in more likely.' });
  if (d.screenShift)
    r.push({ label: 'Screen shift', value: d.screenShift, cls: /on/i.test(d.screenShift) ? 'on' : 'off',
             act: d.writable ? 'shift' : null, on: /on/i.test(d.screenShift),
             press: 'Press OK to switch ' + (/on/i.test(d.screenShift) ? 'off' : 'on'),
             hint: 'Nudges the whole image by a pixel now and then so a fixed edge never sits on the same pixels. Invisible in use.' });
  if (d.logoDimming)
    r.push({ label: 'Logo dimming', value: d.logoDimming, cls: /off/i.test(d.logoDimming) ? 'off' : 'on',
             act: d.writable ? 'logo' : null, cur: String(d.logoDimming).toLowerCase(),
             press: 'Press OK for off, light or high',
             hint: 'Spots a station logo that has not moved and fades it slightly. Higher settings dim more of the picture around it.' });

  if (d.writable) {
    r.push(head('Run now'));
    r.push({ label: 'Schedule a pixel refresher', value: '→', cls: 'act', act: 'refresh',
      press: 'Press OK to schedule',
      hint: 'Queues the long calibration for the next time the TV is switched off. It cannot run while the screen is on.' });
    r.push({ label: 'Cancel a scheduled refresher', value: '→', cls: 'act', act: 'refreshCancel',
      press: 'Press OK to cancel',
      hint: 'Clears a queued calibration so the TV does not spend an hour on it after the next switch-off.' });
  }
  return r;
}

function saverRows(d) {
  if (!d || !d.ok || !d.modes) return [];
  var r = [head('Screen saver')];
  d.modes.filter(function (m) { return m.available; }).forEach(function (m) {
    r.push({ label: m.label, value: m.active ? 'In use' : '', cls: m.active ? 'on' : '',
             act: d.writable ? 'saver' : null, key: m.id,
             press: m.active ? 'Already in use' : 'Press OK to use this one',
             hint: m.id === 'stock'
               ? 'LG’s own screen saver.'
               : 'Replaces LG’s screen saver. Everything on it drifts slowly so no pixel holds the same image.' });
  });
  r.push(head('A firmware update puts LG’s own back'));
  return r;
}

function appsRows(d) {
  if (!d || !d.ok) return [];
  var r = [];

  var inst = d.installed || [];
  if (inst.length > 0) {
    r.push(head('Uninstall Applications'));
    for (var j = 0; j < inst.length; j++) {
      var app = inst[j];
      r.push({
        label: app.title || app.id,
        value: 'Uninstall',
        cls: 'bad',
        act: 'uninstall',
        key: app.id,
        title: app.title || app.id,
        press: 'Press OK to uninstall app',
        hint: 'Store or user-installed application (' + (app.version ? 'v' + app.version + ', ' : '') + app.id + '). Press OK to uninstall from the TV.'
      });
    }
  }

  var sys = d.systemTiles || [];
  if (sys.length > 0) {
    r.push(head('Hide Home Screen System Apps'));
    var tileHidingEnabled = !!d.tileHidingEnabled;
    r.push({
      label: 'System App Hiding',
      value: tileHidingEnabled ? 'Enabled' : 'Disabled',
      cls: tileHidingEnabled ? 'on' : 'off',
      act: 'tileHiding',
      on: tileHidingEnabled,
      press: tileHidingEnabled ? 'Press OK to disable tile hiding' : 'Press OK to enable tile hiding',
      hint: tileHidingEnabled
        ? 'When enabled: On each cold boot of your TV, this can cause a brief 1-second blank screen or input refresh before returning to your active HDMI source.'
        : 'Stock behavior active. Press OK to enable system app hiding.'
    });
    if (tileHidingEnabled) {
      for (var i = 0; i < sys.length; i++) {
        var tile = sys[i];
        var isVisible = !tile.hidden;
        r.push({
          label: tile.title || tile.id,
          value: isVisible ? 'Visible' : 'Hidden',
          cls: isVisible ? 'on' : 'off',
          act: 'tile',
          key: tile.id,
          title: tile.title || tile.id,
          on: isVisible,
          press: isVisible ? 'Press OK to hide tile' : 'Press OK to show tile',
          hint: isVisible
            ? 'Currently visible on the TV home ribbon. Press OK to hide this tile.'
            : 'Currently hidden from the TV home ribbon. Press OK to make this tile visible again.'
        });
      }
    }
  }

  var svcs = d.services || [];
  if (svcs.length > 0) {
    r.push(head('Turn Off Background Services'));
    for (var k = 0; k < svcs.length; k++) {
      var s = svcs[k];
      var isActive = !s.disabled, still = s.disabled && s.running;
      r.push({
        label: s.title || s.id,
        value: isActive ? 'Active' : still ? 'Disabled, still running' : 'Disabled',
        cls: isActive ? 'good' : 'warn',
        act: 'serviceToggle',
        key: s.id,
        title: s.title || s.id,
        on: isActive,
        press: isActive ? 'Press OK to disable service' : 'Press OK to enable service',
        hint: (s.badge ? '[' + s.badge + '] ' : '') + (s.desc || '') +
              (still ? ' Switched off, but something on the TV has started it again.' : '')
      });
    }
  }

  return r;
}

function privacyRows(d) {
  if (!d || !d.ok) return [];
  var r = [];

  // The same three settings as the browser dashboard, stepped through with OK
  // as logo luminance is: off, then ads and telemetry, then everything.
  if (d.adblock) {
    var ab = d.adblock, abMode = ab.enabled ? (ab.mode || 'full') : 'off';
    var AB = {
      off:  { label: 'Off', next: 'ads',
              hint: 'Nothing is blocked. LG’s advertising and telemetry addresses work as normal.' },
      ads:  { label: 'Ads & telemetry', next: 'full',
              hint: 'Blocks ' + (ab.adCount || 'the') + ' advertising, tracking and diagnostics addresses. ' +
                    'LG’s app store and software updates still work.' },
      full: { label: 'Everything', next: 'off',
              hint: 'Blocks all ' + (ab.count || '') + ' addresses, including LG’s platform services' +
                    (ab.platform && ab.platform.length ? ' (' + ab.platform.slice(0, 2).join(', ') + ' and others)' : '') +
                    '. Features that rely on them, such as the app store, may stop working.' }
    };
    var cur = AB[abMode] || AB.off;
    r.push(head('Ad and tracker blocking'));
    r.push({ label: 'Blocking', value: cur.label, cls: abMode === 'off' ? 'off' : 'on',
             act: 'adblock', key: cur.next,
             press: 'Press OK for ' + AB[cur.next].label,
             hint: cur.hint + ' Streaming apps are untouched.' });
    if (ab.enabled && ab.count !== null && ab.count !== undefined)
      r.push({ label: 'Addresses blocked', value: num(abMode === 'ads' && ab.adCount ? ab.adCount : ab.count),
        hint: 'How many addresses the setting above covers.' });
  }

  if (d.acr) {
    r.push(head('Screen content recognition'));
    var canAcr = d.consentWritable !== false;
    r.push({ label: d.acr.label || 'Screen content recognition',
             value: d.acr.active ? 'Active' : 'Off', cls: d.acr.active ? 'off' : 'on',
             act: canAcr ? 'acr' : null, on: d.acr.active,
             press: d.acr.active ? 'Press OK to switch off' : 'Press OK to switch on',
             hint: 'LG calls this ACR. It samples what is on screen - including from HDMI - to work out what is being watched and build a profile from it.' });
    if (d.acr.captureState)
      r.push({ label: 'Capture', value: d.acr.capturing ? 'Capturing' : 'Stopped',
               cls: d.acr.capturing ? 'off' : 'on',
               hint: 'Whether it is sampling the screen right now, as opposed to merely being switched on.' });
  }

  if (d.advertisingId && d.advertisingId.available) {
    r.push(head('Advertising identifier'));
    r.push({ label: d.advertisingId.limitTrackingLabel || 'Limit ad tracking',
             value: d.advertisingId.limitTracking ? 'On' : 'Off',
             cls: d.advertisingId.limitTracking ? 'on' : 'off',
             hint: 'When on, apps are asked not to use the TV’s advertising ID to profile the viewer. It is a request, not an enforcement.' });
    r.push({ label: 'Reset the advertising ID', value: '→', cls: 'act', act: 'resetAdId',
             press: 'Press OK to reset',
             hint: 'Issues a fresh identifier, which breaks the link to whatever has been collected against the old one. Harmless to repeat.' });
  }

  // Each opens its own list, one row per consent or service.
  if (d.consent && d.consent.known) {
    var all = d.consent.known.concat(d.consent.other || []);
    var on = all.filter(function (c) { return c.enabled; }).length;
    r.push(head('Data consents'));
    r.push({ label: 'Consents switched on', value: on + ' of ' + all.length,
             cls: on === 0 ? 'on' : '', act: 'open', key: 'consents',
             press: d.consentWritable === false ? 'Press OK to see them' : 'Press OK to see and change them',
             web: '/?tab=privacy',
             hint: 'The agreements the TV records against this account, each with what it lets LG do.',
             scan: 'They can be changed from a phone too.' });
  }

  var sup = supervised(d);
  if (sup.length) {
    var run = sup.filter(function (x) { return x.running; }).length;
    r.push({ label: 'LG data services running', value: run + ' of ' + sup.length,
             cls: run === 0 ? 'on' : '', act: 'open', key: 'services',
             press: 'Press OK to see them',
             hint: 'Background services that collect and send usage data. They are switched off in the Apps tab.' });
  }
  return r;
}

/*
 * The lists a Privacy row opens. They replace the tab's rows until Back, or
 * the first row, returns to it. A switch that changes the TV reloads the list,
 * since LG ties some consents together and one can take others with it.
 */
var SUBLISTS = { consents: consentRows, services: serviceRows };
var sub = null, subFrom = 0;

function buildRows(t, d) {
  return (sub && t.key === 'privacy') ? SUBLISTS[sub](d) : (t.build(d) || []);
}

function openSub(key) {
  subFrom = sel;
  sub = key;
  rows = buildRows(T(), data[T().key]);
  sel = nextRow(firstSel());           // the first entry, past the way back
  render();
}

function closeSub() {
  sub = null;
  rows = T().build(data[T().key]) || [];
  sel = subFrom < rows.length ? subFrom : firstSel();
  render();
}

function nextRow(i) {
  do { i++; } while (i < rows.length && rows[i].head);
  return i < rows.length ? i : firstSel();
}

function backRow() {
  return { label: '‹ Privacy', value: '', act: 'close', press: 'Press OK or Back to return',
           hint: 'Back to the Privacy tab.' };
}

// Only the supervised services: an on-demand one starts whenever anything asks
// it a question, this dashboard included, so its state would say more about
// the asking than the TV.
function supervised(d) {
  return (d && d.daemons || []).filter(function (x) { return !x.onDemand; });
}

function consentRows(d) {
  if (!d || !d.ok || !d.consent) return [backRow()];
  var cw = d.consentWritable !== false;
  var flags = (d.consent.known || []).concat(d.consent.other || []);
  var groups = d.consentGroups || [['unknown', '']];
  var r = [backRow()];
  groups.forEach(function (g) {
    var inGroup = flags.filter(function (f) { return (f.group || 'unknown') === g[0]; });
    if (!inGroup.length) return;
    // Flags with no name and no agreement behind them are one row, not one
    // each: five rows saying the same nothing tell less than a count.
    var anon = g[0] === 'unknown' ? inGroup.filter(function (f) { return !f.settable && !f.documents; }) : [];
    inGroup = inGroup.filter(function (f) { return anon.indexOf(f) < 0; });
    r.push(head(g[1] || 'Other'));
    inGroup.forEach(function (f) {
      var can = cw && f.settable;
      var why = [f.detail ? f.detail.replace(/([^.!?])$/, '$1.') : ''];
      if (f.agreements && f.agreements.length) why.push('Part of: ' + f.agreements.join(', ') + '.');
      if (f.sharesWith && f.sharesWith.length) why.push('Switching this off also switches off ' + f.sharesWith.join(', ') + '.');
      if (!can && g[2]) why.push(g[2]);
      else if (!can && !cw) why.push('Controls are switched off in this dashboard’s config.');
      r.push({ label: f.label || f.key, value: f.enabled ? 'On' : 'Off',
               cls: f.enabled ? 'off' : 'on', act: can ? 'consent' : null, key: f.key, on: f.enabled,
               press: f.enabled ? 'Press OK to switch off' : 'Press OK to switch on',
               hint: why.join(' ') });
    });
    if (anon.length) {
      var anonOn = anon.filter(function (f) { return f.enabled; }).length;
      r.push({ label: anon.length + ' unidentified flag' + (anon.length === 1 ? '' : 's'),
               value: anonOn ? anonOn + ' on' : 'All off', cls: anonOn ? 'off' : 'on',
               hint: 'Recorded by the TV, tied to no agreement on this firmware, and not writable.' });
    }
  });
  return r;
}

// What is running, and where to switch it off: the Apps tab's background
// services, which hold them off across reboots.
function serviceRows(d) {
  var r = [backRow(), head('LG data services')];
  supervised(d).forEach(function (x) {
    r.push({ label: x.label || x.name, value: x.running ? 'Running' : 'Stopped',
             cls: x.running ? 'off' : 'on',
             hint: (x.detail ? x.detail.replace(/([^.!?])$/, '$1.') + ' ' : '') +
                   'Switched off in the Apps tab, under Turn Off Background Services.' });
  });
  if (r.length === 2) r.push({ label: 'None on this TV', value: '' });
  return r;
}

/*
 * The TV's own settings: whether the dashboard is open to the network, and
 * Home Assistant. They are changed only on the TV, with the remote - the server
 * refuses them from anywhere else - so a browser elsewhere just says so.
 */
function settingsRows(d) {
  if (!d || !d.ok) {
    return [{ label: 'Changed on the TV itself', value: '',
              hint: 'These settings can only be changed with the remote, on the TV.' }].concat(appearanceRows());
  }
  var WEB = 'A fuller version of this dashboard, with more controls, for a browser on a phone or computer. ';
  var r = [head('This dashboard')];
  r.push({ label: 'Web dashboard', value: d.network ? 'On' : 'Off', cls: d.network ? 'on' : 'off',
           act: d.writable ? 'net' : null, on: d.network,
           press: d.network ? 'Press OK to switch it off' : 'Press OK to switch it on',
           hint: WEB + (d.network
             ? (d.token
               ? 'It is on for your home network, and needs the dashboard’s access token, which the code under Address includes.'
               : 'It is on for your home network, with no password, so anyone on that network can use it.')
             : 'It is off, so only this TV can reach the dashboard.') });
  if (d.network && d.address) {
    r.push({ label: 'Address', value: d.address, web: '/',
             hint: 'Where the web dashboard is, for a browser on a phone or computer on your home network.',
             scan: 'Scan to open it on your phone.' });
  }
  var ha = d.homeAssistant || {};
  var haValue = !ha.configured ? 'Not set up' :
                ha.state === 'connected' ? 'Connected' :
                ha.state === 'error' ? 'Not connecting' : 'Connecting';
  r.push(head('Home Assistant (MQTT)'));
  r.push({ label: 'Home Assistant', value: haValue, cls: ha.state === 'connected' ? 'on' : '',
           act: d.writable ? 'ha' : null,
           press: ha.configured ? 'Press OK to set it up again' : 'Press OK to set it up on your phone',
           hint: ha.state === 'connected'
             ? 'Connected to Home Assistant through your MQTT broker. The TV reports its state and takes commands, so it can join your automations.'
             : ha.configured
               ? 'The MQTT broker’s details are saved, but the TV cannot connect to it yet. Set it up again to check them.'
               : 'Connects this TV to Home Assistant through an MQTT broker, such as Home Assistant’s Mosquitto add-on, so it can join your automations. The broker’s details are entered on your phone.' });
  return r.concat(appearanceRows());
}

function svcRows(d) {
  if (!d || !d.ok) return [];
  var r = [head('Service menu')];
  if (d.lockable)
    r.push({ label: 'Lock', value: d.locked ? 'Locked' : 'Unlocked',
             cls: d.locked ? 'on' : 'off', act: d.writable ? 'lock' : null, on: d.locked,
             press: d.locked ? 'Press OK to unlock' : 'Press OK to lock',
             hint: 'Locked keeps the engineering menus shut even to someone who knows the button sequence.' });
  if (d.app && d.writable) {
    r.push({ label: 'Open EZ Adjust', value: '→', cls: 'act', act: 'menu', key: 'ezAdjust',
             press: 'Press OK to open',
             hint: 'LG’s engineering menu. It can change panel calibration and hardware settings the normal menus keep out of reach, and some are not easy to put back. The TV asks for a four-digit PIN — usually 0413, though it varies by model and region.' });
    r.push({ label: 'Open In Start', value: '→', cls: 'act', act: 'menu', key: 'inStart',
             press: 'Press OK to open',
             hint: 'The factory setup menu, with model and region settings. Changing these can leave the TV misconfigured. The TV asks for a four-digit PIN — usually 0413, though it varies by model and region.' });
  }
  if (r.length === 1) r.push({ label: 'Not available on this TV', value: '' });
  return r;
}

function updateRows(d) {
  if (!d || !d.ok) return [];
  var r = [];
  r.push(head('Software Updates'));

  var inst = d.installed ? ('v' + d.installed) : '—';
  r.push({
    label: 'Installed version',
    value: inst,
    hint: 'The version of tvweb currently running on this TV.'
  });

  if (d.state === 'checking') {
    r.push({
      label: 'Latest release',
      value: 'Checking…',
      cls: 'warn',
      hint: 'Looking for a new release.'
    });
  } else if (d.available && d.latest) {
    r.push({
      label: 'Latest release',
      value: 'v' + d.latest,
      cls: 'on',
      hint: 'A newer release is available (v' + d.latest + ').'
    });
    if (d.viaHomebrewChannel) {
      r.push({
        label: 'Install update',
        value: 'In the Homebrew Channel',
        hint: 'Update Glasshouse in the Homebrew Channel. The server follows within a few minutes, keeping your settings, ad blocker and screen saver.'
      });
    } else if (d.writable) {
      r.push({
        label: 'Install update',
        value: 'Install v' + d.latest,
        cls: 'act',
        act: 'update',
        targetVer: d.latest,
        press: 'Press OK to install v' + d.latest,
        hint: 'Downloads and installs v' + d.latest + ' directly on the TV. Settings, ad blocker, and screen saver are preserved. The TV server restarts automatically.'
      });
    }
  } else if (d.latest) {
    r.push({
      label: 'Latest release',
      value: 'v' + d.latest + ' (Up to date)',
      cls: 'off',
      hint: 'You are running the latest release.'
    });
  } else if (d.error) {
    r.push({
      label: 'Latest release',
      value: 'Check failed',
      cls: 'bad',
      hint: 'Could not check for a new release: ' + d.error
    });
  }

  if (d.writable && d.state !== 'checking' && !d.available) {
    r.push({
      label: 'Check for updates',
      value: 'Check now',
      cls: 'act',
      act: 'updateCheck',
      press: 'Press OK to check for updates',
      hint: 'Looks for a newer release now.'
    });
  }

  if (d.rollbackTo && d.writable) {
    r.push(head('Rollback'));
    r.push({
      label: 'Roll back version',
      value: 'Roll back to v' + d.rollbackTo,
      cls: 'warn',
      act: 'updateRollback',
      targetVer: d.rollbackTo,
      press: 'Press OK to roll back to v' + d.rollbackTo,
      hint: 'Restores the previous backup version (v' + d.rollbackTo + ') and restarts the server.'
    });
  }

  r.push(head('Information'));
  if (d.checkedMs !== null && d.checkedMs !== undefined) {
    var mins = Math.floor(d.checkedMs / 60000);
    var checkedStr = mins < 1 ? 'Just now' : (mins === 1 ? '1 min ago' : mins + ' mins ago');
    r.push({
      label: 'Last checked',
      value: checkedStr,
      hint: 'When the TV last checked for a new release.'
    });
  }

  if (!d.writable) {
    r.push({
      label: 'Controls disabled',
      value: 'Read-only',
      cls: 'off',
      hint: 'allowControl is false in config.json. Updates cannot be triggered from the TV.'
    });
  }

  return r;
}

// ---- rendering ----

function rowHeight(r) { return (r && r.head ? HEAD_VH : ROW_VH) * window.innerHeight / 100; }

function render() {
  var box = document.getElementById('rows'), msg = document.getElementById('msg');
  if (!rows.length) {
    box.innerHTML = '';
    msg.style.display = 'block';
    var d = data[T().key];
    if (!d) {
      msg.innerHTML = 'Loading\u2026';
    } else if (d.error) {
      var detail = '<div class="msg-detail">' + esc(d.error);
      if (lanOrigin) detail += '<br>Use the web dashboard instead: <span class="msg-url">' + esc(lanOrigin) + '</span>';
      detail += '<br>If this persists, open an issue at github.com/rorygallagher2024/lg-webos-dashboard' +
                '<br>and include the error: <span class="msg-url">' + esc(d.error) + '</span></div>';
      msg.innerHTML = 'Something went wrong' + detail;
    } else {
      msg.innerHTML = 'Nothing to show here';
    }
    return;
  }
  msg.style.display = 'none';
  box.innerHTML = rows.map(function (r, i) {
    if (r.head) return '<div class="row head"><span class="lbl">' + esc(r.label) + '</span></div>';
    return '<div class="row' + (i === sel ? ' sel' : '') + (r.act ? ' doable' : '') + '" onclick="pickRow(' + i + ')">' +
             '<span class="lbl">' + esc(r.label) + '</span>' +
             '<span class="val' + (r.cls ? ' ' + r.cls : '') + '">' + esc(r.value) + '</span>' +
           '</div>';
  }).join('');
  position();
  renderHint();
}

/*
 * The explainer for the selected row. Rows carry their own text; where one has
 * none the panel still says whether OK does anything, because that is the part
 * a reader cannot work out by looking.
 */
function renderHint() {
  var el = document.getElementById('hint');
  var r = rows[sel];
  if (!r || r.head) { el.className = ''; return; }
  document.getElementById('hintTitle').textContent = r.label;
  // The scan prompt is added only when there is a code to scan.
  document.getElementById('hintBody').textContent =
    (r.hint || '') + (renderQr(r) && r.scan ? ' ' + r.scan : '');
  var act = document.getElementById('hintAct');
  act.textContent = r.act ? (r.press || 'Press OK to change') : 'View only';
  act.className = 'h-act' + (r.act ? '' : ' ro');
  el.className = 'on';
}

/* A row marked `web` can only be changed in a browser, so it offers a code to
   scan rather than an address to type on a remote. Drawn as one path of dark
   modules; an unreachable address or an over-long URL simply shows nothing. */
function renderQr(r) {
  var box = document.getElementById('hintQr');
  if (!r.web || !lanOrigin) { box.className = 'h-qr'; return false; }
  var url = lanOrigin + (r.web === true ? '/' : r.web);
  // The code carries the token so the phone can use the page; the address
  // printed beneath it leaves it out.
  var scan = lanKey ? url + (url.indexOf('?') < 0 ? '?' : '&') + 'k=' + encodeURIComponent(lanKey) : url;
  if (!qrDraw(document.getElementById('hintQrSvg'), scan)) { box.className = 'h-qr'; return false; }
  document.getElementById('hintUrl').textContent = url.replace(/^https?:\/\//, '');
  box.className = 'h-qr on';
  return true;
}

/* Headings are not landing places, so the selection skips over them and the
   offset is summed from real row heights rather than multiplied.
   The list is anchored to the top and only starts scrolling once the selection
   passes the middle, so a short section fills the screen from the top instead
   of floating in the centre with half the screen empty. */
function position() {
  var list = document.getElementById('list');
  var off = 0, total = 0, i;
  for (i = 0; i < rows.length; i++) {
    if (i < sel) off += rowHeight(rows[i]);
    total += rowHeight(rows[i]);
  }
  var centre = list.clientHeight / 2 - rowHeight(rows[sel]) / 2;
  var y = centre - off;
  var floor = Math.min(0, list.clientHeight - total);   // never scroll past the last row
  if (y > 0) y = 0;
  if (y < floor) y = floor;
  document.getElementById('rows').style.transform = 'translateY(' + y + 'px)';
  document.getElementById('moreUp').className = 'more' + (y < 0 ? ' on' : '');
  document.getElementById('moreDown').className = 'more' + (y > floor ? ' on' : '');
}

function firstSel() {
  for (var i = 0; i < rows.length; i++) if (!rows[i].head) return i;
  return 0;
}
function lastSel() {
  for (var i = rows.length - 1; i >= 0; i--) if (!rows[i].head) return i;
  return 0;
}

function move(d) {
  if (!rows.length) return;
  var i = sel;
  do { i += d; } while (i >= 0 && i < rows.length && rows[i].head);
  if (i < 0 || i >= rows.length) return;
  sel = i;
  render();
}

function pickRow(i) {
  if (i < 0 || i >= rows.length || rows[i].head) return;
  if (sel === i && rows[i].act) activate();
  else { sel = i; render(); }
}

function renderTabs() {
  var bar = document.getElementById('tabs');
  bar.innerHTML = TABS.map(function (t, i) {
    return '<div class="tab' + (i === tab ? ' on' : '') + '" data-label="' + esc(t.label) + '" onclick="openTab(' + i + ')">' +
      esc(t.label) + '</div>';
  }).join('');
  // More tabs than fit across the screen: scroll the bar to keep the selected
  // one in view, and fade whichever edge has tabs hidden beyond it.
  var on = bar.children[tab];
  var left = on.getBoundingClientRect().left - bar.getBoundingClientRect().left + bar.scrollLeft;
  if (left < bar.scrollLeft) bar.scrollLeft = left;
  else if (left + on.offsetWidth > bar.scrollLeft + bar.clientWidth) bar.scrollLeft = left + on.offsetWidth - bar.clientWidth;
  bar.className = (bar.scrollLeft > 0 ? 'clip-l ' : '') +
    (bar.scrollLeft + bar.clientWidth < bar.scrollWidth - 1 ? 'clip-r' : '');
}

function flash(text) {
  var el = document.getElementById('flash');
  el.textContent = text;
  el.className = 'on';
  if (flashTimer) clearTimeout(flashTimer);
  flashTimer = setTimeout(function () { el.className = ''; }, 2400);
}

// ---- data ----

function fetchTab(keepSel) {
  var t = T(), key = t.key;
  fetch(t.url, { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (T().key !== key) return;        // the user moved on while this was in flight
      data[key] = d;
      rows = buildRows(t, d);
      if (initialSel !== null && initialSel < rows.length && (!rows[initialSel] || !rows[initialSel].head)) {
        sel = initialSel;
        initialSel = null;
      } else if (!keepSel || sel >= rows.length || (rows[sel] && rows[sel].head)) {
        sel = firstSel();
      }
      render();
    })
    .catch(function () {
      if (T().key !== key || rows.length) return;
      document.getElementById('rows').innerHTML = '';
      var msg = document.getElementById('msg');
      msg.style.display = 'block';
      var detail = '<div class="msg-detail">The tvweb server did not respond.';
      if (lanOrigin) detail += '<br>Use the web dashboard instead: <span class="msg-url">' + esc(lanOrigin) + '</span>';
      detail += '<br>If this persists, open an issue at github.com/rorygallagher2024/lg-webos-dashboard</div>';
      msg.innerHTML = 'Could not reach the TV server' + detail;
    });
}

function openTab(i, keepSel) {
  if (timer) { clearInterval(timer); timer = null; }
  tab = i;
  sub = null;
  if (!keepSel) sel = 0;
  rows = [];
  renderTabs();
  var cached = data[T().key];
  if (cached) {
    rows = T().build(cached) || [];
    if (!keepSel) sel = firstSel();
  }
  render();
  fetchTab(keepSel || !!cached);
  if (T().poll) timer = setInterval(function () { fetchTab(true); }, T().poll);
  if (T().key === 'update') checkUpdateOnOpen();
}

function checkUpdateOnOpen() {
  var d = data.update;
  if (busy || (d && d.writable === false) || (d && d.attemptedMs !== null && d.attemptedMs < 120000)) return;
  fetch('/api/control', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'updateCheck', value: 'open' })
  }).then(function (r) { return r.json().catch(function () { return {}; }); })
    .then(function (res) {
      if (T().key === 'update' && res && res.ok) {
        data.update = res;
        rows = updateRows(res) || [];
        render();
      }
    }).catch(function () {});
}

function switchTab(d) {
  var n = tab + d;
  if (n < 0 || n >= TABS.length) return;
  openTab(n);
}

// ---- actions ----

function awaitRestart(targetVer, doneLabel) {
  busy = true;
  var box = document.getElementById('rows'), msg = document.getElementById('msg');
  box.innerHTML = '';
  msg.style.display = 'block';
  msg.innerHTML = 'Installing update\u2026<div class="msg-detail">The TV server is restarting. Please wait\u2026</div>';

  var attempts = 0;
  var poll = setInterval(function () {
    attempts++;
    fetch('/api/update', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.ok) {
          if (!targetVer || d.installed === targetVer) {
            clearInterval(poll);
            busy = false;
            flash(doneLabel || 'Update complete');
            setTimeout(function () {
              location.replace(location.pathname + '?tab=update&t=' + Date.now());
            }, 1000);
          }
        }
      })
      .catch(function () {});
    if (attempts > 80) {
      clearInterval(poll);
      busy = false;
      flash('Restart is taking longer than expected');
      fetchTab(true);
    }
  }, 1500);
}

function send(body, note) {
  busy = true;
  fetch('/api/control', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function (r) { return r.json().catch(function () { return {}; }); })
    .then(function (res) {
      busy = false;
      if (res && res.ok === false) { flash(res.error || 'That did not work'); return fetchTab(true); }
      if (note) flash(note);
      fetchTab(true);
    })
    .catch(function () { busy = false; flash('That did not work'); });
}

function sendPost(url, body, note) {
  busy = true;
  fetch(url, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function (r) { return r.json().catch(function () { return {}; }); })
    .then(function (res) {
      busy = false;
      if (res && res.ok === false) { flash(res.error || 'That did not work'); return fetchTab(true); }
      if (note) flash(note);
      fetchTab(true);
    })
    .catch(function () { busy = false; flash('That did not work'); });
}

/*
 * Opening or closing the dashboard restarts the server to apply it, so wait for
 * it to answer again before showing the new state.
 */
function setNetwork(open) {
  busy = true;
  flash(open ? 'Opening it to your network…' : 'Keeping it to this TV…');
  fetch('/api/setup', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'network', open: open })
  }).then(function (r) { return r.json().catch(function () { return {}; }); })
    .then(function (res) {
      if (res && res.ok === false) { busy = false; flash(res.error || 'That did not work'); return; }
      setTimeout(function () { untilBack(30); }, 1500);
    })
    .catch(function () { busy = false; flash('That did not work'); });
}

function untilBack(tries) {
  fetch('/api/setup', { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('not yet'); return r.json(); })
    .then(function () { busy = false; refreshCaps(); fetchTab(true); })
    .catch(function () {
      if (tries <= 0) { busy = false; flash('It did not come back. Try again.'); return; }
      setTimeout(function () { untilBack(tries - 1); }, 1000);
    });
}

function activate() {
  if (busy || !rows.length) return;
  var r = rows[sel];
  if (!r || !r.act) return;
  switch (r.act) {
    case 'uninstall':
      if (!r.confirming) {
        r.confirming = true;
        r.origValue = r.value;
        r.origPress = r.press;
        r.origCls = r.cls;
        r.value = 'Confirm?';
        r.cls = 'warn';
        r.press = 'Press OK again to confirm uninstall';
        flash('Press OK again to uninstall ' + (r.title || r.key));
        render();
        setTimeout(function () {
          if (r.confirming) {
            r.confirming = false;
            r.value = r.origValue;
            r.press = r.origPress;
            r.cls = r.origCls;
            render();
          }
        }, 4000);
        return;
      }
      r.confirming = false;
      r.value = 'Uninstalling…';
      r.cls = 'warn';
      flash('Uninstalling ' + (r.title || r.key) + '…');
      render();
      return sendPost('/api/apps/uninstall', { id: r.key }, 'App uninstalled');
    case 'tile':
      var ep = r.on ? '/api/apps/hide' : '/api/apps/unhide';
      r.value = r.on ? 'Hiding…' : 'Showing…';
      flash((r.on ? 'Hiding ' : 'Showing ') + (r.title || r.key) + '…');
      render();
      return sendPost(ep, { id: r.key }, r.on ? 'Tile hidden' : 'Tile visible');
    case 'tileHiding':
      var nextHiding = !r.on;
      r.value = nextHiding ? 'Enabling…' : 'Disabling…';
      flash((nextHiding ? 'Enabling' : 'Disabling') + ' tile hiding…');
      render();
      return sendPost('/api/apps/tile-hiding', { enabled: nextHiding }, nextHiding ? 'Tile hiding enabled' : 'Tile hiding disabled');
    case 'serviceToggle':
      var nextDisabled = r.on;
      r.value = nextDisabled ? 'Disabling…' : 'Enabling…';
      flash((nextDisabled ? 'Disabling ' : 'Enabling ') + (r.title || r.key) + '…');
      render();
      return sendPost('/api/services/toggle', { id: r.key, disabled: nextDisabled }, nextDisabled ? 'Service disabled' : 'Service enabled');
    case 'oled':
      return send({ action: 'oledProtection', value: { key: r.key, enabled: !r.on } },
                  r.on ? 'Switched off' : 'Switched on');
    case 'shift':
      return send({ action: 'screenShift', value: r.on ? 'off' : 'on' });
    case 'logo':
      // off -> light -> strong -> off
      var next = r.cur === 'off' ? 'light' : (r.cur === 'light' ? 'strong' : 'off');
      return send({ action: 'logoDimming', value: next });
    case 'refresh':
      return send({ action: 'refresherSchedule' }, 'Refresher scheduled');
    case 'refreshCancel':
      return send({ action: 'refresherCancel' }, 'Refresher cancelled');
    case 'saver':
      return send({ action: 'screensaverMode', value: r.key });
    case 'quickBoot':
      return send({ action: 'quickBoot', value: !r.on }, r.on ? 'Quick Boot turned off' : 'Quick Boot turned on');
    case 'standbyLight':
      return send({ action: 'standbyLight', value: !r.on }, r.on ? 'Standby LED turned off' : 'Standby LED turned on');
    case 'adblock':
      return send({ action: 'setAdBlock', value: r.key });
    case 'acr':
      return send({ action: 'acr', value: !r.on }, r.on ? 'Switched off' : 'Switched on');
    case 'open':
      return openSub(r.key);
    case 'close':
      return closeSub();
    case 'consent':
      return send({ action: 'consent', value: { key: r.key, enabled: !r.on } },
                  r.on ? 'Switched off' : 'Switched on');
    case 'resetAdId':
      return send({ action: 'resetAdId' }, 'Advertising ID reset');
    case 'lock':
      return send({ action: 'serviceMenuLock', value: { locked: !r.on } });
    case 'menu':
      return send({ action: 'serviceMenuOpen', value: { menu: r.key } }, 'Opening…');
    case 'net':
      return setNetwork(!r.on);
    case 'ha':
      return location.assign('/assets/setup.html#ha');
    case 'toggleTheme':
      var nextTheme = currentTheme === 'light' ? 'dark' : 'light';
      applyTheme(nextTheme);
      try { localStorage.setItem('theme', nextTheme); } catch (e) {}
      flash('Theme: ' + (nextTheme === 'light' ? 'Light' : 'Dark'));
      if (T().key === 'settings') {
        rows = settingsRows(data.settings || {});
        render();
      }
      return;
    case 'updateCheck':
      r.value = 'Checking…';
      r.cls = 'warn';
      render();
      flash('Checking for updates…');
      return sendPost('/api/control', { action: 'updateCheck' }, 'Check complete');
    case 'update':
      if (!r.confirming) {
        r.confirming = true;
        r.origValue = r.value;
        r.origPress = r.press;
        r.origCls = r.cls;
        r.value = 'Confirm?';
        r.cls = 'warn';
        r.press = 'Press OK again to install v' + r.targetVer;
        flash('Press OK again to install v' + r.targetVer);
        render();
        setTimeout(function () {
          if (r.confirming) {
            r.confirming = false;
            r.value = r.origValue;
            r.press = r.origPress;
            r.cls = r.origCls;
            render();
          }
        }, 4000);
        return;
      }
      r.confirming = false;
      r.value = 'Installing…';
      r.cls = 'warn';
      render();
      flash('Installing v' + r.targetVer + '…');
      busy = true;
      fetch('/api/control', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'update' })
      }).then(function (res) { return res.json().catch(function () { return {}; }); })
        .then(function (res) {
          if (res && res.ok === false) {
            busy = false;
            flash(res.error || 'Update failed');
            return fetchTab(true);
          }
          awaitRestart(r.targetVer, 'Updated to v' + r.targetVer);
        })
        .catch(function () {
          awaitRestart(r.targetVer, 'Updated to v' + r.targetVer);
        });
      return;
    case 'updateRollback':
      if (!r.confirming) {
        r.confirming = true;
        r.origValue = r.value;
        r.origPress = r.press;
        r.origCls = r.cls;
        r.value = 'Confirm?';
        r.cls = 'warn';
        r.press = 'Press OK again to roll back to v' + r.targetVer;
        flash('Press OK again to roll back to v' + r.targetVer);
        render();
        setTimeout(function () {
          if (r.confirming) {
            r.confirming = false;
            r.value = r.origValue;
            r.press = r.origPress;
            r.cls = r.origCls;
            render();
          }
        }, 4000);
        return;
      }
      r.confirming = false;
      r.value = 'Rolling back…';
      r.cls = 'warn';
      render();
      flash('Rolling back to v' + r.targetVer + '…');
      busy = true;
      fetch('/api/control', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'updateRollback' })
      }).then(function (res) { return res.json().catch(function () { return {}; }); })
        .then(function (res) {
          if (res && res.ok === false) {
            busy = false;
            flash(res.error || 'Rollback failed');
            return fetchTab(true);
          }
          awaitRestart(r.targetVer, 'Rolled back to v' + r.targetVer);
        })
        .catch(function () {
          awaitRestart(r.targetVer, 'Rolled back to v' + r.targetVer);
        });
      return;
  }
}

// ---- keys ----

/*
 * The app declares disableBackHistoryAPI, so Back is delivered to this page
 * rather than handled by the system, and ignoring it left Back doing nothing.
 * There is no screen to step back to, so it leaves the app as Back does
 * everywhere else on the TV. platformBack is webOS's own Back; window.close
 * covers the page being opened somewhere other than the app.
 */
// Back only sends a webOS app to the background, and opening it again from the
// home screen resumes the page as it was. Reload instead, on the same tab, so
// a server updated in the meantime shows its current dashboard.
document.addEventListener('webOSRelaunch', function () {
  location.replace(location.pathname + '?tab=' + T().key + '&t=' + Date.now());
});

function leaveApp() {
  if (window.PalmSystem && typeof window.PalmSystem.platformBack === 'function') {
    window.PalmSystem.platformBack();
  } else {
    window.close();
  }
}

document.addEventListener('keydown', function (e) {
  var k = e.key, c = e.keyCode;

  // Inside a list opened from a row, Left goes back up to it rather than to
  // another tab, and Right has nowhere to go.
  if      (c === 37 || k === 'ArrowLeft')  { if (sub) closeSub(); else switchTab(-1); e.preventDefault(); }
  else if (c === 39 || k === 'ArrowRight') { if (!sub) switchTab(1); e.preventDefault(); }
  else if (c === 38 || k === 'ArrowUp')    { move(-1);      e.preventDefault(); }
  else if (c === 40 || k === 'ArrowDown')  { move(1);       e.preventDefault(); }
  else if (c === 13 || k === 'Enter')      { activate();    e.preventDefault(); }
  else if (c === 461 || k === 'GoBack' || k === 'BrowserBack') { if (sub) closeSub(); else leaveApp(); e.preventDefault(); }
});
window.addEventListener('resize', function () { if (rows.length) position(); });

renderTabs();
var initTab = 0;
var match = location.search.match(/[?&]tab=([^&]+)/);
if (match) {
  var wanted = decodeURIComponent(match[1]).toLowerCase();
  for (var ti = 0; ti < TABS.length; ti++) {
    if (TABS[ti].key === wanted) { initTab = ti; break; }
  }
}
var selMatch = location.search.match(/[?&]sel=([^&]+)/);
if (selMatch) {
  var pSel = parseInt(selMatch[1], 10);
  if (!isNaN(pSel)) {
    sel = pSel;
    initialSel = pSel;
  }
}
openTab(initTab, initialSel !== null);
</script>
