<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Connect Home Assistant</title>
<style>
/* Served by the TV's one-time setup link, which serves nothing else, so this
   page carries everything it needs: no fonts or scripts from the TV. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;color:#fff}
body{font:16px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  padding:max(28px,env(safe-area-inset-top)) 22px 40px;max-width:480px;margin:0 auto}
h1{font-weight:400;font-size:26px;line-height:1.2;margin:0 0 8px}
.sub{color:rgba(255,255,255,.6);font-size:15px;margin-bottom:26px}
label{display:block;font-size:13px;color:rgba(255,255,255,.6);margin:18px 0 6px}
input[type=text],input[type=password],input[type=number]{width:100%;font:inherit;color:#fff;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:12px 14px}
input:focus{outline:none;border-color:#1ec15f}
.check{display:flex;align-items:center;gap:10px;margin-top:18px;font-size:15px;color:rgba(255,255,255,.85)}
.check input{width:20px;height:20px;accent-color:#1ec15f}
.note{font-size:13px;color:rgba(255,255,255,.45);margin-top:6px}
button{width:100%;margin-top:30px;font:inherit;font-weight:500;color:#000;background:#1ec15f;
  border:0;border-radius:8px;padding:14px}
button:disabled{opacity:.5}
#msg{margin-top:16px;font-size:15px;min-height:1.5em}
#msg.err{color:#ff8a80}
.done h1{margin-top:20vh}
</style>
</head>
<body>
<main id="form">
  <h1>Connect Home Assistant</h1>
  <p class="sub">The details of your MQTT broker. With the Mosquitto add-on, the address is your Home Assistant's own.</p>

  <label for="host">Broker address</label>
  <input id="host" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="192.168.1.10" required>

  <label for="port">Port</label>
  <input id="port" type="number" inputmode="numeric" value="1883" min="1" max="65535">

  <label for="user">Username</label>
  <input id="user" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">

  <label for="pass">Password</label>
  <input id="pass" type="password" autocomplete="off">

  <label class="check"><input id="tls" type="checkbox"> Encrypted connection (TLS)</label>
  <p class="note">Only if your broker is set up for it. Usually on port 8883.</p>

  <button id="save" type="button">Connect</button>
  <p id="msg" role="status"></p>
</main>

<main id="done" class="done" hidden>
  <h1>Sent to the TV</h1>
  <p class="sub">It's connecting now and will show the result on screen. You can close this page.</p>
</main>

<script>
(function () {
  var code = (location.search.match(/[?&]c=([0-9a-f]+)/) || [])[1] || '';
  var $ = function (id) { return document.getElementById(id); };
  var msg = $('msg'), btn = $('save');

  // Moving to TLS usually means moving to its port too, so follow it unless
  // the port was set by hand.
  var portTouched = false;
  $('port').addEventListener('input', function () { portTouched = true; });
  $('tls').addEventListener('change', function () {
    if (!portTouched) $('port').value = this.checked ? '8883' : '1883';
  });

  function say(text, err) { msg.textContent = text; msg.className = err ? 'err' : ''; }

  btn.addEventListener('click', function () {
    var host = $('host').value.trim();
    if (!host) { $('host').focus(); return say('Enter the broker address.', true); }
    var port = parseInt($('port').value, 10);
    if (!(port >= 1 && port <= 65535)) { $('port').focus(); return say('The port is a number from 1 to 65535.', true); }
    btn.disabled = true;
    say('Sending…');
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/mqtt?c=' + encodeURIComponent(code), true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.onload = function () {
      var r = {};
      try { r = JSON.parse(xhr.responseText); } catch (e) {}
      if (xhr.status === 200 && r.ok) {
        $('form').hidden = true;
        $('done').hidden = false;
        return;
      }
      btn.disabled = false;
      if (xhr.status === 403) return say('This link has expired. Start again on the TV.', true);
      say(r.error ? 'The TV turned that down: ' + r.error + '.' : 'That did not work. Try again.', true);
    };
    xhr.onerror = function () {
      btn.disabled = false;
      say('Could not reach the TV. Check your phone is on the same network.', true);
    };
    xhr.send(JSON.stringify({
      host: host, port: port, tls: $('tls').checked,
      username: $('user').value.trim(), password: $('pass').value
    }));
  });
})();
</script>
</body>
</html>
