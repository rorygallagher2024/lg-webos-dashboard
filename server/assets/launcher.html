<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920,initial-scale=1">
<title>tvweb launcher</title>
<style>
/* A plain launcher for the TV: the inputs and the apps, each on their own tab,
   driven by the remote. Left/Right flips between tabs, Up/Down moves within one.
   Outfit for the names (the spectacle face), Manrope for small labels, on true
   black. Sized for 1080p viewed from the sofa. */
@font-face{font-family:'Outfit';src:url('/assets/fonts/Outfit.ttf') format('truetype');font-weight:100 900;font-display:swap}
@font-face{font-family:'Manrope';src:url('/assets/fonts/Manrope.ttf') format('truetype');font-weight:200 800;font-display:swap}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;overflow:hidden}
body{font-family:'Manrope',sans-serif;color:#fff;
  /* the remote drives it; hide the cursor */ cursor:none}

#stage{height:100vh;display:flex;flex-direction:column;padding:5vh 0 5vh 8vw}

#clock{font-family:'Outfit';font-weight:200;font-size:4.4vh;letter-spacing:.01em;
  line-height:1;opacity:.55;flex:0 0 auto;margin-bottom:3.4vh}

/* The tabs. Left/Right moves between them; the one in view is full white, the
   rest recede so it reads as a row you flip through. */
#tabs{display:flex;align-items:baseline;gap:2.8vw;flex:0 0 auto;margin-bottom:4.4vh}
.tab{font-family:'Outfit';font-weight:200;font-size:4.6vh;line-height:1;letter-spacing:.01em;
  color:rgba(255,255,255,.26);transition:color .22s ease}
.tab.on{color:#fff;font-weight:300}

/* The list for the current tab. Only the selected row is full white and full
   size; the rest recede, so the eye lands on the choice, not the chrome. */
#list{flex:1 1 auto;overflow:hidden;position:relative}
#rows{position:absolute;left:0;right:0;transition:transform .28s cubic-bezier(.4,0,.2,1)}
.row{display:flex;align-items:center;gap:2.4vw;height:11vh;
  opacity:.34;transition:opacity .22s ease,transform .22s ease;transform-origin:left center}
.row.sel{opacity:1;transform:scale(1.06)}
.ic{width:7vh;height:7vh;flex:0 0 auto;border-radius:1.2vh;background:#141414;
  background-size:cover;background-position:center;display:flex;align-items:center;
  justify-content:center;font-family:'Outfit';font-weight:400;font-size:3vh;color:#fff;overflow:hidden}
.meta{display:flex;flex-direction:column;gap:.6vh;min-width:0}
.title{font-family:'Outfit';font-weight:200;font-size:6vh;line-height:1;letter-spacing:.005em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70vw}
.sel .title{font-weight:300}
.tag{font-family:'Manrope';font-weight:600;font-size:1.4vh;letter-spacing:.24em;
  text-transform:uppercase;color:rgba(255,255,255,.5)}
.tag.off{color:rgba(255,255,255,.28)}

#msg{position:absolute;top:50%;left:0;transform:translateY(-50%);
  font-family:'Outfit';font-weight:200;font-size:4vh;color:rgba(255,255,255,.5)}

/* An arrow hint when there is more above or below. */
.more{position:absolute;left:0;font-family:'Manrope';font-size:3vh;color:rgba(255,255,255,.3);
  opacity:0;transition:opacity .2s}
.more.on{opacity:1}
#moreUp{top:0}
#moreDown{bottom:0}
</style>
</head>
<body>
<div id="stage">
  <div id="clock">--:--</div>
  <nav id="tabs"></nav>
  <div id="list">
    <div id="msg">Loading&hellip;</div>
    <div class="more" id="moreUp">&#9650;</div>
    <div id="rows"></div>
    <div class="more" id="moreDown">&#9660;</div>
  </div>
</div>
<script>
var TABS = [
  { key: 'sources', label: 'Sources', items: [] },
  { key: 'apps',    label: 'Apps',    items: [] }
];
var tab = 0, sel = 0, busy = false, ROW_VH = 11;

function cur(){ return TABS[tab].items; }

function tick(){
  var d = new Date();
  var h = d.getHours(), m = d.getMinutes();
  document.getElementById('clock').textContent =
    (h<10?'0':'')+h + ':' + (m<10?'0':'')+m;
}
setInterval(tick, 10000); tick();

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function iconHtml(it){
  if (it.icon) return '<div class="ic" style="background-image:url(\'' + esc(it.icon) + '\')"></div>';
  var letter = (it.title || '?').charAt(0).toUpperCase();
  var bg = it.iconColor && /^#/.test(it.iconColor) ? it.iconColor : '#141414';
  return '<div class="ic" style="background:' + esc(bg) + '">' + esc(letter) + '</div>';
}

function renderTabs(){
  document.getElementById('tabs').innerHTML = TABS.map(function(t, i){
    return '<div class="tab' + (i===tab?' on':'') + '">' + esc(t.label) + '</div>';
  }).join('');
}

function render(){
  var items = cur();
  var rows = document.getElementById('rows');
  var msg = document.getElementById('msg');
  if (!items.length){
    rows.innerHTML = '';
    msg.style.display = 'block';
    msg.textContent = TABS[tab].key === 'sources' ? 'No inputs connected' : 'Nothing here';
    position();
    return;
  }
  msg.style.display = 'none';
  rows.innerHTML = items.map(function(it, i){
    var tag = it.kind === 'input'
      ? '<span class="tag' + (it.connected ? '' : ' off') + '">Input' + (it.connected ? '' : ' &middot; no signal') + '</span>'
      : '<span class="tag">App</span>';
    return '<div class="row' + (i===sel?' sel':'') + '">' +
             iconHtml(it) +
             '<div class="meta">' + tag + '<div class="title">' + esc(it.title) + '</div></div>' +
           '</div>';
  }).join('');
  position();
}

// Keep the selected row vertically centred in the list area.
function position(){
  var list = document.getElementById('list');
  var rowPx = window.innerHeight * ROW_VH / 100;
  var centre = list.clientHeight/2 - rowPx/2;
  var n = cur().length;
  document.getElementById('rows').style.transform = 'translateY(' + (centre - sel*rowPx) + 'px)';
  document.getElementById('moreUp').className = 'more' + (sel>0 ? ' on' : '');
  document.getElementById('moreDown').className = 'more' + (sel<n-1 ? ' on' : '');
}

function move(d){
  var items = cur();
  if (!items.length) return;
  sel = Math.max(0, Math.min(items.length-1, sel+d));
  render();
}

function switchTab(d){
  var nt = Math.max(0, Math.min(TABS.length-1, tab+d));
  if (nt === tab) return;
  tab = nt; sel = 0;
  renderTabs(); render();
}

function launch(){
  var items = cur();
  if (busy || !items.length) return;
  busy = true;
  var it = items[sel];
  fetch('/api/control', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ action:'launchApp', value: it.id })
  }).then(function(){ setTimeout(function(){ busy=false; }, 800); })
    .catch(function(){ busy=false; });
}

document.addEventListener('keydown', function(e){
  var k = e.key;
  if      (e.keyCode === 37 || k === 'ArrowLeft')  { switchTab(-1); e.preventDefault(); }
  else if (e.keyCode === 39 || k === 'ArrowRight') { switchTab(1);  e.preventDefault(); }
  else if (e.keyCode === 38 || k === 'ArrowUp')    { move(-1);      e.preventDefault(); }
  else if (e.keyCode === 40 || k === 'ArrowDown')  { move(1);       e.preventDefault(); }
  else if (e.keyCode === 13 || k === 'Enter')      { launch();      e.preventDefault(); }
  // Back (461 on webOS) is left to the system, which exits the app.
});
window.addEventListener('resize', position);

function load(){
  fetch('/api/launchpoints', {cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d || !d.ok) throw new Error('bad data');
      TABS[0].items = (d.inputs||[]).slice().sort(function(a,b){ return (b.connected?1:0)-(a.connected?1:0); });
      TABS[1].items = d.apps || [];
      tab = 0; sel = 0;
      renderTabs(); render();
    })
    .catch(function(){
      document.getElementById('msg').textContent = 'Could not reach the TV server';
    });
}
renderTabs();
load();
</script>
</body>
</html>
